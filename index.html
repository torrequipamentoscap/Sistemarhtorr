// Cadastro rapido de motivo direto no lancamento
function togMotRap(sel){
  var r=document.getElementById(sel+"-novo");if(!r)return;
  var show=!r.classList.contains("on");r.classList.toggle("on",show);
  if(show)document.getElementById(sel+"-nm").focus();
}
function addMotRap(sel){
  var nm=gv(sel+"-nm").trim();
  if(!nm){alert("Informe o nome do motivo.");return;}
  var tipo=sel==="etmotivo"?gv("ettipo"):lancT;
  var ex=DB.motivos.find(function(m){return m.tipo===tipo&&m.nome.toLowerCase()===nm.toLowerCase();});
  var novo=ex||{id:uid(),tipo:tipo,nome:nm,desc:""};
  if(!ex){DB.motivos.push(novo);dbSave();}
  var s=document.getElementById(sel);if(s)s.innerHTML=motOpts(tipo,novo.id);
  document.getElementById(sel+"-nm").value="";
  document.getElementById(sel+"-novo").classList.remove("on");
}
function savLanc(){
  var eid=gv("lemp"),data=gv("ldata"),obs=gv("lobs"),motivo_id=gv("lmotivo");
  if(!eid||!data){alert("Selecione colaborador e data.");return;}
  var emp=DB.emp.find(function(e){return e.id===eid;});
  if(emp&&emp.dem&&gmk(data)>gmk(emp.dem)){alert("Colaborador demitido em "+fmtD(emp.dem)+". Nao e possivel lancar para "+fmtM(gmk(data))+".");return;}
  DB.oc.push({id:uid(),eid:eid,tipo:lancT,data:data,obs:obs,motivo_id:motivo_id});
  dbSave();rLanc();
}

function savEdtLanc(id){
  var tipo=document.getElementById("ettipo").value,data=document.getElementById("etdata").value,obs=document.getElementById("etobs").value;
  if(!data){alert("Informe a data.");return;}
  var o=DB.oc.find(function(x){return x.id===id;});
  var emp=DB.emp.find(function(e){return e.id===o.eid;});
  if(emp&&emp.dem&&gmk(data)>gmk(emp.dem)){alert(emp.nome+" foi demitido em "+fmtD(emp.dem)+". Data invalida.");return;}

  DB.oc=DB.oc.map(function(x){return x.id===id?Object.assign({},x,{tipo:tipo,data:data,obs:obs,motivo_id:etmot}):x;});

var motTipoSel="falta";
function setMotTipo(t){
  motTipoSel=t;
  var el=document.getElementById("mot-tipo-sel");if(el)el.value=t;
  var bf=document.getElementById("motbf"),ba=document.getElementById("motba");
  if(bf){if(t==="falta"){bf.style.borderColor=RED;bf.style.background=RED+"18";bf.style.color=RED;}else{bf.style.borderColor="#dfe5ee";bf.style.background="#fff";bf.style.color="#777";}}

  // Update motivo list select
  var sel=document.getElementById("mot-tipo");if(sel)sel.value=t;
}
function savMot(){
  var id=document.getElementById("mot-id").value;
  var tipo=document.getElementById("mot-tipo-sel").value;
  var nome=document.getElementById("mot-nome").value.trim();
  var desc=document.getElementById("mot-desc").value.trim();
  if(!nome){alert("Informe o nome do motivo.");return;}
  var obj={id:id||uid(),tipo:tipo,nome:nome,desc:desc};
  if(id){DB.motivos=DB.motivos.map(function(x){return x.id===id?obj:x;});}else{DB.motivos.push(obj);}
  dbSave();canMot();rMotivos();
}
function edtMot(id){
  var m=DB.motivos.find(function(x){return x.id===id;});if(!m)return;
  document.getElementById("mot-id").value=id;
  document.getElementById("mot-nome").value=m.nome;
  document.getElementById("mot-desc").value=m.desc||"";
  document.getElementById("mot-ft").textContent="Editar motivo";
  document.getElementById("mot-cb").style.display="";
  document.querySelector("#p-motivos .btnp").textContent="Salvar alteracoes";
  setMotTipo(m.tipo);
}

function setModo5S(m){
  s5Modo=m;
  var el=document.getElementById("s5modo");if(el)el.value=m;
  var bgeral=document.getElementById("s5mgeral"),bcc=document.getElementById("s5mcc");
  var ccrow=document.getElementById("s5ccrow");
  if(m==="geral"){
    if(bgeral){bgeral.style.borderColor=RED;bgeral.style.background=RED+"18";bgeral.style.color=RED;}
    if(bcc){bcc.style.borderColor="#dfe5ee";bcc.style.background="#fff";bcc.style.color="#777";}
    if(ccrow)ccrow.style.display="none";

    if(bcc){bcc.style.borderColor=BL;bcc.style.background=BL+"18";bcc.style.color=BL;}

function upd5SPreview(){
  var pl=document.getElementById("s5prevlist");if(!pl)return;
  var modo=gv("s5modo")||"geral",ccid=gv("s5cc");
  var base=s5Base();
  var emps=s5Sel.map(function(id){return DB.emp.find(function(e){return e.id===id;});}).filter(Boolean)
    .sort(function(a,b){return a.nome.localeCompare(b.nome);});
  var alterado=base.length!==s5Sel.length||base.some(function(id){return s5Sel.indexOf(id)<0;});
  var rb=document.getElementById("s5restore");if(rb)rb.style.display=alterado?"":"none";
  if(emps.length===0){
    pl.innerHTML="<span style='color:#aaa'>Nenhum colaborador"+(modo==="cc"&&!ccid?" (selecione um centro ou adicione abaixo)":"")+"</span>";
  }else{
    pl.innerHTML="<strong style='color:"+B+"'>"+emps.length+"</strong> colaborador"+(emps.length!==1?"es":"")+" afetado"+(emps.length!==1?"s":"")
      +" <span style='color:#9aa3ad'>&middot; clique no x para excluir</span>"
      +"<div style='display:flex;flex-wrap:wrap;gap:4px;margin-top:6px'>"
      +emps.map(function(e){
        var extra=base.indexOf(e.id)<0;
        return "<span class='chip"+(extra?" add":"")+"' title='"+esc(e.nome)+(extra?" (adicionado manualmente)":"")+"'>"+esc(nome1(e))
          +"<button type='button' onclick=\"s5Rem('"+e.id+"')\" aria-label='Excluir "+esc(e.nome)+"'><i class='ti ti-x'></i></button></span>";
      }).join("")
      +"</div>";
  }
  var add=document.getElementById("s5add");
  if(add){
    var fora=DB.emp.filter(function(e){return ativoVis(e)&&s5Sel.indexOf(e.id)<0;}).sort(function(a,b){return a.nome.localeCompare(b.nome);});
    add.innerHTML="<option value=''>+ Adicionar colaborador"+(fora.length?" ("+fora.length+" disponive"+(fora.length!==1?"is":"l")+")":"")+"</option>"
      +fora.map(function(e){var c=DB.cc.find(function(x){return x.id===e.ccid;});return "<option value='"+e.id+"'>"+esc(e.nome)+(c?" - "+esc(c.cod):"")+"</option>";}).join("");
    add.disabled=fora.length===0;
  }

function sav5S(){
  var id=gv("s5id");
  var modo=gv("s5modo");
  var ccid=gv("s5cc");
  var data=gv("s5data");
  var obs=gv("s5obs").trim();
  if(!data){alert("Informe a data.");return;}
  if(modo==="cc"&&!ccid){alert("Selecione o centro de custo.");return;}
  var emps=s5Sel.map(function(x){return DB.emp.find(function(e){return e.id===x;});}).filter(Boolean);
  if(emps.length===0){alert("Nenhum colaborador afetado. Adicione ao menos um colaborador.");return;}
  var s5senso=gv("s5senso");
  var obj={id:id||uid(),modo:modo,ccid:modo==="cc"?ccid:"",data:data,obs:obs,senso_id:s5senso,eids:emps.map(function(e){return e.id;})};
  if(id){
    DB.oc5=DB.oc5.map(function(x){return x.id===id?obj:x;});
    DB.oc=DB.oc.filter(function(o){return o.s5ref!==id;});
  }else{
    DB.oc5.push(obj);
  }
  emps.forEach(function(e){
    DB.oc.push({id:uid(),eid:e.id,tipo:"5s",data:data,obs:obs,s5ref:obj.id,senso_id:s5senso});
  });
  dbSave();r5S();
  if(pg==="dashboard"){rDash();reopenDrill();}
}
function edt5S(id){
  var o=DB.oc5.find(function(x){return x.id===id;});if(!o)return;
  can5S();
  document.getElementById("s5id").value=id;
  document.getElementById("s5data").value=o.data;
  document.getElementById("s5obs").value=o.obs||"";
  var ss=document.getElementById("s5senso");if(ss)ss.value=o.senso_id||"";
  document.getElementById("s5ft").textContent="Editar infracao 5S";
  document.getElementById("s5sav").textContent="Salvar alteracoes";
  if(o.modo==="cc"){var cc=document.getElementById("s5cc");if(cc)cc.value=o.ccid||"";}
  setModo5S(o.modo);
  // lista salva (inclui ajustes manuais); registros antigos: colaboradores que receberam o desconto
  s5Sel=s5Afetados(o).map(function(e){return e.id;});
  upd5SPreview();
  openMd("md-5s");
}
function can5S(){
  var i=document.getElementById("s5id");if(!i)return;
  i.value="";
  document.getElementById("s5data").value=hoje();
  document.getElementById("s5obs").value="";
  var ss=document.getElementById("s5senso");if(ss)ss.value="";
  var cc=document.getElementById("s5cc");if(cc)cc.value="";
  document.getElementById("s5ft").textContent="Nova infracao 5S";
  document.getElementById("s5sav").textContent="Lancar Infracao 5S";
  setModo5S("geral");
  closeMd("md-5s");
}
function del5S(id){
  if(!confirm("Remover esta infracao 5S e todos os descontos vinculados?"))return;
  DB.oc5=DB.oc5.filter(function(x){return x.id!==id;});

var MPAL=["#1E5BC6","#c0392b","#e6a817","#7b3fa0","#1a7a4a","#3a4046","#e67e22","#5d6d7e","#16a085","#d35400"];
function rMon(){
  killCH();
  var anoAtual=String(new Date().getFullYear());
  var selAno=gv("mon-ano")||anoAtual;
  var selMes=gv("mon-mes")||curMes();
  selMes=selAno+"-"+selMes.split("-")[1];

  var anos={};anos[anoAtual]=1;
  DB.emp.forEach(function(e){if(!vis(e))return;if(e.adm)anos[e.adm.slice(0,4)]=1;if(e.dem)anos[e.dem.slice(0,4)]=1;});
  var anoOpts=Object.keys(anos).sort().reverse().map(function(a){return "<option value='"+a+"'"+(a===selAno?" selected":"")+">"+a+"</option>";}).join("");

  function fimMes(m){var p=m.split("-");var d=new Date(+p[0],+p[1],0);return p[0]+"-"+p[1]+"-"+String(d.getDate()).padStart(2,"0");}
  function prevMes(m){var p=m.split("-").map(Number);var d=new Date(p[0],p[1]-2,1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");}
  var EMPV=DB.emp.filter(vis),ocV=ocVisF();
  function quadro(m){var f=fimMes(m);return EMPV.filter(function(e){return (!e.adm||e.adm<=f)&&(!e.dem||e.dem>f);}).length;}
  function contr(m){return EMPV.filter(function(e){return e.adm&&e.adm.slice(0,7)===m;});}
  function demit(m){return EMPV.filter(function(e){return e.dem&&e.dem.slice(0,7)===m;});}

  var ultimo=selAno===anoAtual?new Date().getMonth()+1:12;
  if(selAno>anoAtual)ultimo=12;
  var meses=[];for(var i=1;i<=ultimo;i++)meses.push(selAno+"-"+String(i).padStart(2,"0"));
  var lbl=meses.map(function(m){return MOS[parseInt(m.split("-")[1],10)-1];});
  var aQuadro=meses.map(quadro),aContr=meses.map(function(m){return contr(m).length;}),aDem=meses.map(function(m){return demit(m).length;});

  var ativos=EMPV.filter(isAtivo).length,inativos=EMPV.length-ativos;
  var qMes=quadro(selMes),qIni=quadro(prevMes(selMes));
  var cMes=contr(selMes),dMes=demit(selMes);
  var media=(qIni+qMes)/2;
  var turn=media>0?((cMes.length+dMes.length)/2)/media*100:0;
  var mlb=fmtM(selMes);
  var dAno=EMPV.filter(function(e){return e.dem&&e.dem.slice(0,4)===selAno;});
  var cAno=EMPV.filter(function(e){return e.adm&&e.adm.slice(0,4)===selAno;});

  function motBD(list){
    var map={};list.forEach(function(e){var n=motDemNome(e.motdem);map[n]=(map[n]||0)+1;});
    var lbs=Object.keys(map).sort(function(a,b){return map[b]-map[a];});
    return{labels:lbs,values:lbs.map(function(k){return map[k];}),colors:lbs.map(function(k){var i=DB.motdem.findIndex(function(m){return m.nome===k;});return i<0?"#9aa3ad":MPAL[i%MPAL.length];})};
  }
  var bdMes=motBD(dMes),bdAno=motBD(dAno);

  // ABSENTEISMO = faltas / (colaboradores x dias uteis) x 100  (dias uteis = seg a sex; mes atual conta ate hoje)
  function diasUteis(m){
    var p=m.split("-").map(Number),hj=hoje(),n=0,last=new Date(p[0],p[1],0).getDate();
    for(var d=1;d<=last;d++){
      var ds=m+"-"+String(d).padStart(2,"0");
      if(ds>hj)break;
      var w=new Date(p[0],p[1]-1,d).getDay();
      if(w!==0&&w!==6)n++;
    }
    return n;
  }
  function absent(m,ccid){
    var f=fimMes(m),ini=m+"-01";
    var emps=EMPV.filter(function(e){return (!e.adm||e.adm<=f)&&(!e.dem||e.dem>=ini)&&(ccid===undefined||(e.ccid||"")===ccid);});
    var ids={};emps.forEach(function(e){ids[e.id]=1;});
    var faltas=DB.oc.filter(function(o){return o.tipo==="falta"&&gmk(o.data)===m&&ocV(o)&&(ccid===undefined||ids[o.eid]);}).length;
    var atrasos=DB.oc.filter(function(o){return o.tipo==="atraso"&&gmk(o.data)===m&&ocV(o)&&(ccid===undefined||ids[o.eid]);}).length;
    var du=diasUteis(m),base=emps.length*du;
    return{pct:base>0?faltas/base*100:0,faltas:faltas,atrasos:atrasos,du:du,hc:emps.length};
  }
  var aAbs=meses.map(function(m){return absent(m);});
  var absMes=absent(selMes);
  var absAnoF=0,absAnoB=0;
  meses.forEach(function(m,i){absAnoF+=aAbs[i].faltas;absAnoB+=aAbs[i].hc*aAbs[i].du;});
  var absAno=absAnoB>0?absAnoF/absAnoB*100:0;
  var duAno=aAbs.reduce(function(a,r){return a+r.du;},0);
  // acumulado do ano mes a mes (faltas somadas / base somada)
  var accF=0,accB=0,aAbsAcc=aAbs.map(function(r){accF+=r.faltas;accB+=r.hc*r.du;return accB>0?accF/accB*100:0;});
  // absenteismo do ano por centro de custo
  function absentAno(ccid){
    var f=0,b=0,hc={};
    meses.forEach(function(m){var r=absent(m,ccid);f+=r.faltas;b+=r.hc*r.du;});
    return{pct:b>0?f/b*100:0,faltas:f};
  }
  // absenteismo do ano por colaborador (dias uteis dos meses em que estava na empresa)
  var rankAbs=EMPV.map(function(e){
    var du=0,f=0;
    meses.forEach(function(m){
      var fim=fimMes(m),ini=m+"-01";
      if(!((!e.adm||e.adm<=fim)&&(!e.dem||e.dem>=ini)))return;
      du+=diasUteis(m);
      f+=DB.oc.filter(function(o){return o.eid===e.id&&o.tipo==="falta"&&gmk(o.data)===m;}).length;
    });
    return{e:e,f:f,du:du,pct:du>0?f/du*100:0};
  }).filter(function(x){return x.f>0;}).sort(function(a,b){return b.pct-a.pct||b.f-a.f;});
  var ccAbs=DB.cc.map(function(c){var r=absent(selMes,c.id);r.lb=c.cod+" - "+c.desc;r.ano=absentAno(c.id);return r;});
  var semCC=absent(selMes,"");semCC.ano=absentAno("");if(semCC.hc>0||semCC.ano.faltas>0){semCC.lb="Sem centro";ccAbs.push(semCC);}
  ccAbs=ccAbs.filter(function(r){return r.hc>0||r.ano.pct>0;}).sort(function(a,b){return b.ano.pct-a.ano.pct||b.pct-a.pct;});
  function pctF(v){return v.toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:2})+"%";}

  var movs=cMes.map(function(e){return{t:"c",d:e.adm,e:e};}).concat(dMes.map(function(e){return{t:"d",d:e.dem,e:e};}))
    .sort(function(a,b){return b.d.localeCompare(a.d);});
  var movHTML=movs.length===0?"<div class='empty' style='padding:1.5rem'><i class='ti ti-arrows-exchange'></i>Sem admissoes ou demissoes em "+mlb+"</div>":
    movs.map(function(x){
      var c=x.t==="c";
      return "<div style='display:flex;align-items:center;gap:10px;padding:.5rem 0;border-bottom:1px solid #f1f4f8'>"
        +"<div style='width:30px;height:30px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:"+(c?GRN:RED)+"18;color:"+(c?GRN:RED)+"'><i class='ti "+(c?"ti-user-plus":"ti-user-minus")+"' style='font-size:16px'></i></div>"
        +"<div style='min-width:0;flex:1'><div style='font-weight:700;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis'>"+esc(x.e.nome)+"</div>"
        +"<div style='font-size:11px;color:#999'>"+(c?"Admissao":"Demissao")+" em "+fmtD(x.d)+(c?"":" &middot; "+esc(motDemNome(x.e.motdem)))+"</div></div></div>";
    }).join("");

  function chartCard(title,color,icon,inner,h){
    return "<div class='card' style='padding:.9rem'>"
      +"<div style='font-weight:700;font-size:13px;color:"+color+";margin-bottom:.5rem'><i class='ti "+icon+"' style='margin-right:4px'></i>"+title+"</div>"
      +(h?"<div style='height:"+h+"px;position:relative'>"+inner+"</div>":inner)+"</div>";
  }
  function semDados(msg){return "<div class='empty' style='padding:2.5rem 1rem'><i class='ti ti-chart-pie'></i>"+msg+"</div>";}

  document.getElementById("p-monitor").innerHTML=
    "<div class='pg-hd'><div><h1 class='h1'>Monitoramento de Colaboradores</h1>"
    +"<div class='sub'>Quadro, contratacoes, demissoes, absenteismo e motivos de saida</div></div>"
    +"<div style='display:flex;align-items:center;gap:8px;flex-wrap:wrap'>"
    +"<div style='display:flex;align-items:center;gap:6px;background:#fff;border:1.5px solid #dfe5ee;border-radius:8px;padding:.35rem .75rem'>"
    +"<i class='ti ti-calendar' style='color:#888;font-size:15px'></i><span style='font-size:12px;color:#555;font-weight:600'>Ano:</span>"
    +"<select id='mon-ano' onchange='rMon()' style='border:none;outline:none;box-shadow:none;font-size:13px;color:"+B+";font-weight:700;background:transparent;width:auto;padding:0'>"+anoOpts+"</select></div>"
    +"<div style='display:flex;align-items:center;gap:6px;background:#fff;border:1.5px solid #dfe5ee;border-radius:8px;padding:.35rem .75rem'>"
    +"<i class='ti ti-calendar-event' style='color:#888;font-size:15px'></i><span style='font-size:12px;color:#555;font-weight:600'>Mes:</span>"
    +"<select id='mon-mes' onchange='rMon()' style='border:none;outline:none;box-shadow:none;font-size:13px;color:"+B+";font-weight:700;background:transparent;width:auto;padding:0'>"
    +MOS.map(function(m,i){var v=selAno+"-"+String(i+1).padStart(2,"0");return "<option value='"+v+"'"+(v===selMes?" selected":"")+">"+m+"</option>";}).join("")

// ---- graficos do Monitoramento (tela e PDF; s = escala das fontes) ----
function pctF2(v){return (v||0).toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:2})+"%";}
function monLeg(s){return{position:"top",labels:{boxWidth:12*s,font:{size:12*s},padding:10*s,
  generateLabels:function(ch){return ch.data.datasets.map(function(ds,i){var c=ds.hoverBackgroundColor||ds.borderColor;return{text:ds.label,fillStyle:c,strokeStyle:c,lineWidth:0,hidden:!ch.isDatasetVisible(i),datasetIndex:i};});}}};}
function monDL(s,fmt){return{display:function(c){return c.dataset.data[c.dataIndex]>0;},anchor:"end",align:"top",offset:3*s,
  color:function(c){return c.dataset.dlc;},font:{size:12.5*s,weight:800},formatter:fmt};}
function monBase(s){return{responsive:s===1,maintainAspectRatio:false,animation:s===1?{}:false};}
function monX(s){return{ticks:{font:{size:12*s,weight:600},color:"#555"},grid:{display:false}};}
function monCfgQuadro(M,s){
  return{type:"bar",plugins:relDL(),
    data:{labels:M.lbl,datasets:[{label:"Colaboradores",data:M.aQuadro,backgroundColor:vGrad(BL),hoverBackgroundColor:BL,dlc:B,borderRadius:6*s,borderSkipped:false,maxBarThickness:60*s}]},
    options:Object.assign(monBase(s),{plugins:{legend:{display:false},datalabels:monDL(s)},
      scales:{y:{beginAtZero:true,grace:"15%",ticks:{precision:0,font:{size:11*s},color:"#7a838c"},grid:{color:"#f1f4f8"},border:{display:false}},x:monX(s)}})};
}
function monCfgMov(M,s){
  return{type:"bar",plugins:relDL(),
    data:{labels:M.lbl,datasets:[
      {label:"Contratados",data:M.aContr,backgroundColor:vGrad(GRN),hoverBackgroundColor:GRN,dlc:GRN,borderRadius:6*s,borderSkipped:false,maxBarThickness:36*s},
      {label:"Demitidos",data:M.aDem,backgroundColor:vGrad(RED),hoverBackgroundColor:RED,dlc:RED,borderRadius:6*s,borderSkipped:false,maxBarThickness:36*s}]},
    options:Object.assign(monBase(s),{plugins:{legend:monLeg(s),datalabels:monDL(s)},
      scales:{y:{beginAtZero:true,grace:"15%",ticks:{precision:0,font:{size:11*s},color:"#7a838c"},grid:{color:"#f1f4f8"},border:{display:false}},x:monX(s)}})};
}
function monCfgAbs(M,s){
  var ORG="#d35400",DK="#7a2f00";
  return{type:"bar",plugins:relDL(),
    data:{labels:M.lbl,datasets:[
      {type:"line",label:"Acumulado do ano",data:M.aAbsAcc.map(function(v){return +v.toFixed(2);}),order:0,borderColor:DK,backgroundColor:DK,
        borderDash:[6*s,4*s],borderWidth:2.2*s,pointRadius:3*s,pointBackgroundColor:"#fff",pointBorderColor:DK,pointBorderWidth:2*s,tension:.3,
        datalabels:{display:function(c){return c.dataIndex===c.dataset.data.length-1;},align:"top",anchor:"center",offset:8*s,color:"#fff",backgroundColor:DK,borderRadius:4*s,
          padding:{top:2*s,bottom:1*s,left:5*s,right:5*s},font:{size:11.5*s,weight:800},formatter:function(v){return "Ano "+pctF2(v);}}},
      {label:"Absenteismo do mes",data:M.aAbs.map(function(r){return +r.pct.toFixed(2);}),order:1,backgroundColor:vGrad(ORG),hoverBackgroundColor:ORG,dlc:ORG,borderRadius:6*s,borderSkipped:false,maxBarThickness:60*s,
        datalabels:monDL(s,function(v){return pctF2(v);})}]},
    options:Object.assign(monBase(s),{layout:{padding:{right:10*s}},
      plugins:{legend:monLeg(s),
        tooltip:{callbacks:{label:function(c){var r=M.aAbs[c.dataIndex];if(c.dataset.type==="line")return "Acumulado do ano ate "+M.lbl[c.dataIndex]+": "+pctF2(c.raw);return ["Absenteismo do mes: "+pctF2(r.pct),r.faltas+" faltas · "+r.atrasos+" atrasos","Colaboradores: "+r.hc+" · Dias uteis: "+r.du];}}}},
      scales:{y:{beginAtZero:true,grace:"25%",ticks:{font:{size:11*s},color:"#7a838c",callback:function(v){return v+"%";}},grid:{color:"#f1f4f8"},border:{display:false}},x:monX(s)}})};
}
function monCfgAbsCC(M,s){
  function hg(c,l){return function(ctx){var ch=ctx.chart,a=ch.chartArea;if(!a)return c;var g=ch.ctx.createLinearGradient(a.left,0,a.right,0);g.addColorStop(0,shade(c,l));g.addColorStop(1,shade(c,-.05));return g;};}
  var cc=M.ccAbs;
  return{type:"bar",plugins:relDL(),
    data:{labels:cc.map(function(r){return r.lb;}),datasets:[
      {label:"Mes ("+M.mlb+")",data:cc.map(function(r){return +r.pct.toFixed(2);}),dlc:"#d35400",backgroundColor:hg("#d35400",.6),hoverBackgroundColor:"#d35400",borderRadius:5*s,borderSkipped:false,maxBarThickness:18*s},
      {label:"Ano ("+M.selAno+")",data:cc.map(function(r){return +r.ano.pct.toFixed(2);}),dlc:"#7a2f00",backgroundColor:hg("#7a2f00",.55),hoverBackgroundColor:"#7a2f00",borderRadius:5*s,borderSkipped:false,maxBarThickness:18*s}]},
    options:Object.assign(monBase(s),{indexAxis:"y",layout:{padding:{right:55*s}},
      plugins:{legend:monLeg(s),
        tooltip:{callbacks:{label:function(c){var r=cc[c.dataIndex];return c.datasetIndex===0?["Mes: "+pctF2(r.pct),r.faltas+" faltas · "+r.hc+" colaboradores"]:["Ano: "+pctF2(r.ano.pct),r.ano.faltas+" faltas no ano"];}}},
        datalabels:{anchor:"end",align:"right",offset:4*s,color:function(c){return c.dataset.dlc;},font:{size:12*s,weight:800},formatter:function(v){return pctF2(v);}}},
      scales:{x:{beginAtZero:true,ticks:{font:{size:11*s},color:"#7a838c",callback:function(v){return v+"%";}},grid:{color:"#f1f4f8"},border:{display:false}},
              y:{ticks:{font:{size:12*s,weight:600},color:"#555"},grid:{display:false}}}})};
}
function monCfgPie(bd,s){
  if(!bd||!bd.labels.length)return null;
  return{type:"doughnut",plugins:relDL(),
    data:{labels:bd.labels,datasets:[{data:bd.values,backgroundColor:segGrad(bd.colors),hoverBackgroundColor:bd.colors,borderWidth:2*s,borderColor:"#fff",hoverOffset:6}]},
    options:Object.assign(monBase(s),{cutout:"50%",layout:{padding:4*s},
      plugins:{legend:{position:"bottom",labels:{boxWidth:10*s,font:{size:11*s},padding:6*s,
          generateLabels:function(chart){var l=Chart.overrides.doughnut.plugins.legend.labels.generateLabels(chart);l.forEach(function(it,i){it.fillStyle=bd.colors[i%bd.colors.length];it.strokeStyle=bd.colors[i%bd.colors.length];});return l;}}},
        tooltip:{callbacks:{label:function(c){var t=c.dataset.data.reduce(function(a,b){return a+b;},0);return c.label+": "+c.raw+" ("+Math.round(c.raw/t*100)+"%)";}}},
        datalabels:{color:"#fff",font:{size:13*s,weight:800},textStrokeColor:"rgba(0,0,0,.25)",textStrokeWidth:2}}})};
}

// ═══ KIT PDF PADRAO TORR (cabecalho com logo, paineis, tabelas, rodape) ═══
function mkPdfKit(titulo,periodo,orient,papel){
  var retrato=orient==="portrait",a3=papel==="a3";
  var doc=new window.jspdf.jsPDF({unit:"mm",format:a3?"a3":"a4",orientation:retrato?"portrait":"landscape",compress:true});
  var lg=a3?420:297,ct=a3?297:210;
  var K={doc:doc,W:retrato?ct:lg,H:retrato?lg:ct,mg:12,BANDH:27,PX:7};
  K.cw=K.W-K.mg*2;
  var C=K.C={ink:[36,40,44],b:[58,64,70],bl:[107,115,123],red:[192,57,43],grn:[26,122,74],gld:[230,168,23],pur:[123,63,160],org:[211,84,0],dk:[122,47,0],line:[226,231,238],txt:[60,60,60],mut:[140,140,140]};
  function fill(c){doc.setFillColor(c[0],c[1],c[2]);}
  function txt(c){doc.setTextColor(c[0],c[1],c[2]);}
  function font(sz,b){doc.setFont("helvetica",b?"bold":"normal");doc.setFontSize(sz);}
  K.fill=fill;K.txt=txt;K.font=font;
  var agora=new Date(),gerado=agora.toLocaleDateString("pt-BR")+" às "+agora.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  K.header=function(){
    fill(C.ink);doc.rect(0,0,K.W,K.BANDH,"F");fill(C.bl);doc.rect(0,K.BANDH,K.W,1.3,"F");
    if(window._logoPNG)doc.addImage(window._logoPNG,"PNG",K.mg,6.5,30.8,14);
    else{font(18,true);txt([255,255,255]);doc.text("TORR",K.mg,16);}
    font(15,true);txt([255,255,255]);doc.text(titulo,K.W-K.mg,11.5,{align:"right"});
    font(8.5);txt([205,212,222]);doc.text(periodo,K.W-K.mg,17.5,{align:"right"});
    font(7);txt([165,175,190]);doc.text("Gerado em "+gerado,K.W-K.mg,22,{align:"right"});
    return K.BANDH+8;
  };
  K.section=function(t,y,c){fill(c||C.b);doc.rect(K.mg,y-3.1,2.2,2.2,"F");font(10.5,true);txt([45,45,45]);doc.text(t,K.mg+4.5,y);};
  K.panel=function(x,y,w,h){doc.setFillColor(255,255,255);doc.setDrawColor(C.line[0],C.line[1],C.line[2]);doc.setLineWidth(.35);doc.roundedRect(x,y,w,h,2,2,"FD");};
  K.kpi=function(x,y,w,h,lb,val,sub,c){
    K.panel(x,y,w,h);fill(c);doc.rect(x,y,w,1.2,"F");
    font(6.2,true);txt(C.mut);var lbs=doc.splitTextToSize(lb.toUpperCase(),w-5).slice(0,2);
    doc.text(lbs,x+2.8,y+5.4,{lineHeightFactor:1.15});
    var vy=lbs.length>1?y+14.6:y+12.4;
    font(12.5,true);txt(c);doc.text(String(val),x+2.8,vy);
    if(sub){font(6);txt(C.mut);var ls=doc.splitTextToSize(sub,w-5);doc.text(ls[0],x+2.8,vy+4.4);}
  };
  K.chartImg=function(cfg,wmm,hmm){
    if(!cfg)return null;
    var cv=document.createElement("canvas");cv.width=Math.round(wmm*K.PX);cv.height=Math.round(hmm*K.PX);
    cv.style.position="fixed";cv.style.left="-99999px";document.body.appendChild(cv);
    var ch=new Chart(cv,cfg);var img=ch.toBase64Image();ch.destroy();cv.remove();return img;
  };
  K.chartPanel=function(cfg,x,y,w,h,t,c,nota){
    K.panel(x,y,w,h);font(9,true);txt(c);doc.text(t,x+4,y+6.5);
    if(nota){font(7);txt(C.mut);doc.text(nota,x+w-4,y+6.5,{align:"right"});}
    doc.setDrawColor(C.line[0],C.line[1],C.line[2]);doc.setLineWidth(.25);doc.line(x+4,y+8.8,x+w-4,y+8.8);
    var aw=w-8,ah=h-13;var img=typeof cfg==="function"?K.chartImg(cfg(aw,ah),aw,ah):K.chartImg(cfg,aw,ah);
    if(!img){font(8.5);txt([185,185,185]);doc.text("Sem dados no período",x+w/2,y+h/2,{align:"center"});return;}
    doc.addImage(img,"PNG",x+4,y+10.5,aw,ah);
  };
  K.table=function(y,cols,rows,opt){
    opt=opt||{};var rh=opt.rh||5.6,x=opt.x||K.mg,tw=cols.reduce(function(a,c){return a+c.w;},0),fs=opt.fs||7.2;
    function head(){
      font(fs+.1,true);
      // cabecalho quebra em ate 2 linhas quando o titulo nao cabe na coluna
      var linhas=cols.map(function(c){var l=doc.splitTextToSize(c.h,c.w-2.4);if(l.length>2){l=[l[0],l.slice(1).join(" ")];}
        return l.map(function(t){while(t.length>3&&doc.getTextWidth(t)>c.w-2.2)t=t.slice(0,-1);return t;});});
      var nl=Math.max.apply(null,linhas.map(function(l){return l.length;})),lh=(fs+.1)*0.42,hh=rh+.6+(nl-1)*lh;
      fill(C.b);doc.rect(x,y,tw,hh,"F");txt([255,255,255]);
      var cx=x;cols.forEach(function(c,i){var l=linhas[i],y0=y+hh/2-(l.length-1)*lh/2+1.5;
        l.forEach(function(t,j){doc.text(t,c.al==="r"?cx+c.w-2:c.al==="c"?cx+c.w/2:cx+2,y0+j*lh,{align:c.al==="r"?"right":c.al==="c"?"center":"left"});});cx+=c.w;});
      y+=hh;
    }
    head();
    rows.forEach(function(r,i){
      if(y+rh>K.H-14){doc.addPage();y=K.header();if(opt.titulo)K.section(opt.titulo+" (continuação)",y,opt.cor);y+=4;head();}
      if(r._total){fill(r._grand?[214,218,222]:[232,234,236]);doc.rect(x,y,tw,rh+.4,"F");}
      else if(r._bg){fill(r._bg);doc.rect(x,y,tw,rh,"F");}
      else if(r._hl){fill([236,238,240]);doc.rect(x,y,tw,rh,"F");}
      else if(i%2===1){fill([248,250,252]);doc.rect(x,y,tw,rh,"F");}
      var cx=x;
      cols.forEach(function(c){
        var v=r[c.k];v=v===undefined||v===null?"":String(v);
        font(fs,r._total||r._hl||c.b);
        while(v.length>3&&doc.getTextWidth(v)>c.w-3)v=v.slice(0,-2);
        txt(r._total&&!c.cor?C.b:(r._cor||(c.cor?c.cor(r):C.txt)));
        doc.text(v,c.al==="r"?cx+c.w-2:c.al==="c"?cx+c.w/2:cx+2,y+rh/2+1.5,{align:c.al==="r"?"right":c.al==="c"?"center":"left"});
        cx+=c.w;
      });
      y+=r._total?rh+.4:rh;
    });
    doc.setDrawColor(C.line[0],C.line[1],C.line[2]);doc.setLineWidth(.25);doc.line(x,y,x+tw,y);
    return y;
  };
  K.finalizar=function(nome){
    var n=doc.getNumberOfPages();
    for(var p=1;p<=n;p++){
      doc.setPage(p);doc.setDrawColor(C.line[0],C.line[1],C.line[2]);doc.setLineWidth(.3);doc.line(K.mg,K.H-9,K.W-K.mg,K.H-9);
      font(7.2);txt([160,160,160]);
      doc.text("TORR Equipamentos - Gestão de Prêmios",K.mg,K.H-5);
      doc.text(titulo,K.W/2,K.H-5,{align:"center"});
      doc.text("Página "+p+"/"+n,K.W-K.mg,K.H-5,{align:"right"});
    }
    doc.save(nome);
  };
  return K;
}

function gerarEmpPDF(){

    .sort(function(a,b){return (a.empresa||"").localeCompare(b.empresa||"")||(a.func||"").localeCompare(b.func||"")||a.nome.localeCompare(b.nome);});

  var sitLb={tela:"Conforme a tela",ativos:"Ativos",inativos:"Inativos / demitidos",todos:"Todos"}[sit];
  var grpLb={cc:"centro de custo",empresa:"empresa",func:"função",nenhum:""}[grp];
  var K=mkPdfKit("Cadastro de Colaboradores",sitLb+(grpLb?"  |  Agrupado por "+grpLb:"")+"  |  "+lista.length+" colaborador"+(lista.length!==1?"es":""),"landscape",papel),doc=K.doc,C=K.C,cw=K.cw;
  // larguras proporcionais ao conteudo de cada coluna
  var PESO={empresa:1.05,nome:2.3,func:1.3,cc:1.45,vinc:.55,sit:.88,adm:.98,tempo:.85,aniv:.98,horario:1.08,sal:1.15,terco:1.12,dec13:1.15,cesta:1.05,assid:1.05,pmetas:1.05,bonus:1.05,refeit:1.05,custo:1.25};
  var PL={empresa:"EMPRESA",nome:"FUNCIONÁRIO",func:"FUNÇÃO",cc:"CENTRO DE CUSTO",vinc:"VÍNC.",sit:"SITUAÇÃO",adm:"ADMIS.",tempo:"TEMPO EMPRESA",aniv:"ANIVERS.",horario:"HORÁRIO",
    sal:"SALÁRIO",terco:"1/3 FÉRIAS",dec13:"13º SALÁRIO",cesta:"CESTA BÁSICA",assid:"ASSIDUID.",pmetas:"PRÊMIO METAS",bonus:"BÔNUS ANUAL",refeit:"REFEITÓRIO",custo:"CUSTO MENSAL"};
  var pesos=cols0.map(function(c){return PESO[c.k]||1;}),somaP=pesos.reduce(function(a,b){return a+b;},0)+0.35;
  var unit=cw/somaP;

  var cols=[{h:"#",k:"_i",w:unit*.35,al:"c",cor:function(){return C.mut;}}].concat(cols0.map(function(c,ix){
    var money=MONEY_K.indexOf(c.k)>=0;
    var o={h:PL[c.k]||c.lb,k:c.k,w:pesos[ix]*unit,al:money?"r":(c.c||c.t==="dt"?"c":"l")};
    if(c.k==="nome"){o.b=true;o.cor=function(){return C.ink;};}
    if(c.k==="custo"){o.b=true;o.cor=function(){return C.b;};}
    if(c.k==="sit")o.cor=function(r){return stCor[r.sit]||C.txt;};
    if(c.k==="vinc")o.cor=function(r){return r.vinc==="MEI"?C.pur:[31,95,168];};
    return o;
  }));
  var fs=papel==="a3"?7.6:(cols.length>13?6.4:cols.length>10?6.8:7.2),rh=papel==="a3"?6.2:5.6;
  var moneyCols=cols0.filter(function(c){return MONEY_K.indexOf(c.k)>=0;}).map(function(c){return c.k;});
  var colLbl=cols0.some(function(c){return c.k==="nome";})?"nome":cols[1].k;
  function linha(e,i){
    var r={_i:i+1};
    cols0.forEach(function(c){
      if(MONEY_K.indexOf(c.k)>=0){var v=empCampoVal(e,c.k);r[c.k]=v===null?"-":fmtBRL(v);}
      else r[c.k]=empTxt(e,c.k)||"-";
    });

    return r;
  }
  function somar(l){var t={};MONEY_K.forEach(function(k){t[k]=0;});l.forEach(function(e){MONEY_K.forEach(function(k){t[k]+=empCampoVal(e,k)||0;});});return t;}
  function linhaTot(lb,t,grand){var r={_total:true,_grand:!!grand};r[colLbl]=lb;moneyCols.forEach(function(k){r[k]=fmtBRL(t[k]);});return r;}
  // ── indicadores ──
  var T=somar(lista),nAt=lista.filter(isAtivo).length,comSal=lista.filter(function(e){return typeof e.sal==="number";});

  // ── grupos ──

  if(moneyCols.length){
    if(y+rh*2>K.H-14){doc.addPage();y=K.header();}

    K.section("Resumo por "+grpLb,y);y+=3;

      {h:"FOLHA SALARIAL",k:"sal",w:cw*.14,al:"r"},{h:"SALÁRIO MÉDIO",k:"med",w:cw*.12,al:"r"},{h:"BENEFÍCIOS",k:"ben",w:cw*.11,al:"r"},
      {h:"PROVISÕES",k:"prov",w:cw*.10,al:"r"},{h:"CUSTO MENSAL",k:"cu",w:cw*.13,al:"r",b:true,cor:function(){return C.b;}}];
    var rr=grupos.map(function(g){var t=somar(g.emps),ns=g.emps.filter(function(e){return typeof e.sal==="number";}).length;
      return {g:g.lb,n:g.emps.length,sal:fmtBRL(t.sal),med:fmtBRL(ns?t.sal/ns:0),ben:fmtBRL(t.cesta+t.assid+t.pmetas+t.refeit),prov:fmtBRL((t.terco+t.dec13+t.bonus)/12),cu:fmtBRL(t.custo)};});
    rr.push({_total:true,_grand:true,g:"TOTAL",n:lista.length,sal:fmtBRL(T.sal),med:fmtBRL(comSal.length?T.sal/comSal.length:0),ben:fmtBRL(benef),prov:fmtBRL(prov),cu:fmtBRL(T.custo)});
    y=K.table(y,rc,rr,{rh:6,fs:7.6,titulo:"Resumo por "+grpLb})+6;
  }
  if(y+8>K.H-12){doc.addPage();y=K.header();}

}

var relModo="mes",ORGc="#d35400";
function pct1(v){return (v||0).toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1})+"%";}
function fmtK(v){v=v||0;return Math.abs(v)>=10000?"R$"+(v/1000).toLocaleString("pt-BR",{maximumFractionDigits:1})+" mil":fmtBRLInt(v);}
function fimMesStr(m){var p=m.split("-");var d=new Date(+p[0],+p[1],0);return m+"-"+String(d.getDate()).padStart(2,"0");}
function dUteis(m){
  var p=m.split("-").map(Number),hj=hoje(),n=0,last=new Date(p[0],p[1],0).getDate();
  for(var d=1;d<=last;d++){

function relFin(r){
  r.pctGanho=r.pot>0?r.pago/r.pot*100:0;
  r.pctPerda=r.pot>0?r.perd/r.pot*100:0;
  r.abs=r.absBase>0?r.absF/r.absBase*100:0;
  return r;
}
// Dados de um mes: premio previsto, pago, perdido (dividido por tipo), absenteismo
function relMes(m,se){
  var r={m:m,linhas:[],pot:0,pago:0,perd:0,lf:0,la:0,ls:0,nf:0,na:0,ns:0,ok:0,absF:0,absBase:0};
  DB.emp.forEach(function(e){
    if(se&&e.id!==se)return;
    if(!contaNoMes(e,m))return;
    var pr=DB.pr.find(function(p){return p.eid===e.id;});if(!pr)return;
    var d=calcDesc(e.id,m,pr.val);
    var pf=0,pa=0,ps=0;
    DB.oc.forEach(function(x){
      if(x.eid!==e.id||gmk(x.data)!==m)return;
      var p=getPct(x.tipo,x.data);
      if(x.tipo==="falta")pf+=p;else if(x.tipo==="atraso")pa+=p;else if(x.tipo==="5s")ps+=p;
    });
    var raw=pf+pa+ps,k=raw>0?d.desc/raw:0; // desconto limitado a 100%: rateia proporcionalmente
    var l={emp:e,val:pr.val,f:d.f,a:d.a,s:d.s,pct:d.pct,desc:d.desc,rec:d.rec,lf:pf*k,la:pa*k,ls:ps*k};
    r.linhas.push(l);
    r.pot+=l.val;r.pago+=l.rec;r.perd+=l.desc;r.lf+=l.lf;r.la+=l.la;r.ls+=l.ls;r.nf+=l.f;r.na+=l.a;r.ns+=l.s;
    if(l.pct===0)r.ok++;
  });
  var fim=fimMesStr(m),ini=m+"-01",ids={};
  DB.emp.forEach(function(e){if((!se||e.id===se)&&(!e.adm||e.adm<=fim)&&(!e.dem||e.dem>=ini)&&!afastadoNoMes(e,m)&&vis(e))ids[e.id]=1;});
  r.absF=DB.oc.filter(function(o){return o.tipo==="falta"&&gmk(o.data)===m&&ids[o.eid];}).length;
  r.du=dUteis(m);r.hc=Object.keys(ids).length;r.absBase=r.hc*r.du;
  return relFin(r);
}
function relAcum(lista){
  var r={linhas:[],pot:0,pago:0,perd:0,lf:0,la:0,ls:0,nf:0,na:0,ns:0,absF:0,absBase:0},col={};
  lista.forEach(function(x){
    ["pot","pago","perd","lf","la","ls","nf","na","ns","absF","absBase"].forEach(function(k){r[k]+=x[k];});
    x.linhas.forEach(function(l){
      var c=col[l.emp.id]||(col[l.emp.id]={emp:l.emp,val:0,desc:0,rec:0,f:0,a:0,s:0,lf:0,la:0,ls:0});
      ["val","desc","rec","f","a","s","lf","la","ls"].forEach(function(k){c[k]+=l[k];});
    });
  });
  r.linhas=Object.keys(col).map(function(k){var c=col[k];c.pct=c.val>0?c.desc/c.val*100:0;return c;});
  r.ok=r.linhas.filter(function(l){return l.desc<0.005;}).length;
  return relFin(r);
}

// ═══ PDF: ANALISE DO PAGAMENTO DO PREMIO CARTAO TORR ═══
function gerarAnalisePDF(){
  if(!(window.jspdf&&window.jspdf.jsPDF)){alert("A biblioteca de PDF ainda esta carregando. Aguarde alguns segundos e tente novamente.");return;}
  if(typeof Chart==="undefined"){alert("A biblioteca de graficos ainda esta carregando. Aguarde alguns segundos e tente novamente.");return;}
  var st=window._relStats;if(!st){alert("Abra a tela de Relatorios antes de gerar o PDF.");return;}
  var doc=new window.jspdf.jsPDF({unit:"mm",format:"a4",orientation:"landscape",compress:true});
  var W=297,H=210,mg=12,cw=W-mg*2,BANDH=27,PX=7;
  var C={ink:[36,40,44],b:[58,64,70],bl:[107,115,123],red:[192,57,43],grn:[26,122,74],gld:[230,168,23],pur:[123,63,160],org:[211,84,0],line:[226,231,238],txt:[60,60,60],mut:[140,140,140]};
  function fill(c){doc.setFillColor(c[0],c[1],c[2]);}
  function txt(c){doc.setTextColor(c[0],c[1],c[2]);}
  function font(sz,b){doc.setFont("helvetica",b?"bold":"normal");doc.setFontSize(sz);}
  var titulo="Análise do Pagamento do Prêmio Cartão TORR";
  var agora=new Date(),gerado=agora.toLocaleDateString("pt-BR")+" às "+agora.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  var periodo=(st.modo==="mes"?"Período: ":"Período: ")+st.per+(st.empNome?"  |  Colaborador: "+st.empNome:"  |  Todos os colaboradores");

  function header(){
    fill(C.ink);doc.rect(0,0,W,BANDH,"F");
    fill(C.bl);doc.rect(0,BANDH,W,1.3,"F");
    if(window._logoPNG){doc.addImage(window._logoPNG,"PNG",mg,6.5,30.8,14);}
    else{font(18,true);txt([255,255,255]);doc.text("TORR",mg,16);}
    font(15,true);txt([255,255,255]);doc.text(titulo,W-mg,11.5,{align:"right"});
    font(8.5);txt([205,212,222]);doc.text(periodo,W-mg,17.5,{align:"right"});
    font(7);txt([165,175,190]);doc.text("Gerado em "+gerado,W-mg,22,{align:"right"});
    return BANDH+8;
  }
  function section(t,y,c){fill(c||C.b);doc.rect(mg,y-3.1,2.2,2.2,"F");font(10.5,true);txt([45,45,45]);doc.text(t,mg+4.5,y);}
  function panel(x,y,w,h){doc.setFillColor(255,255,255);doc.setDrawColor(C.line[0],C.line[1],C.line[2]);doc.setLineWidth(.35);doc.roundedRect(x,y,w,h,2,2,"FD");}
  function kpi(x,y,w,h,lb,val,sub,c){
    panel(x,y,w,h);fill(c);doc.rect(x,y,w,1.2,"F");
    font(6.8,true);txt(C.mut);doc.text(lb.toUpperCase(),x+3,y+6.5);
    font(12.5,true);txt(c);doc.text(val,x+3,y+13.5);
    if(sub){font(6.8);txt(C.mut);doc.text(sub,x+3,y+18);}
  }
  function chartImg(cfg,wmm,hmm){
    if(!cfg)return null;
    var cv=document.createElement("canvas");cv.width=Math.round(wmm*PX);cv.height=Math.round(hmm*PX);
    cv.style.position="fixed";cv.style.left="-99999px";document.body.appendChild(cv);
    var ch=new Chart(cv,cfg);var img=ch.toBase64Image();ch.destroy();cv.remove();
    return img;
  }
  function chartPanel(cfg,x,y,w,h,t,c,nota){
    panel(x,y,w,h);
    font(9,true);txt(c);doc.text(t,x+4,y+6.5);
    if(nota){font(7);txt(C.mut);doc.text(nota,x+w-4,y+6.5,{align:"right"});}
    doc.setDrawColor(C.line[0],C.line[1],C.line[2]);doc.setLineWidth(.25);doc.line(x+4,y+8.8,x+w-4,y+8.8);
    var aw=w-8,ah=h-13;
    var img=chartImg(cfg,aw,ah);
    if(!img){font(8.5);txt([185,185,185]);doc.text("Sem dados no período",x+w/2,y+h/2,{align:"center"});return;}
    doc.addImage(img,"PNG",x+4,y+10.5,aw,ah);
  }
  // Tabela com quebra de pagina
  function table(y,cols,rows,opt){
    opt=opt||{};var rh=opt.rh||5.6,x=mg,tw=cols.reduce(function(a,c){return a+c.w;},0);
    function head(){
      fill(C.b);doc.rect(x,y,tw,rh+.6,"F");font(7.3,true);txt([255,255,255]);
      var cx=x;cols.forEach(function(c){doc.text(c.h,c.al==="r"?cx+c.w-2:c.al==="c"?cx+c.w/2:cx+2,y+rh/2+1.6,{align:c.al==="r"?"right":c.al==="c"?"center":"left"});cx+=c.w;});
      y+=rh+.6;
    }
    head();
    rows.forEach(function(r,i){
      if(y+rh>H-14){doc.addPage();y=header();if(opt.titulo)section(opt.titulo+" (continuação)",y,opt.cor);y+=4;head();}
      if(r._total){fill(r._grand?[214,218,222]:[232,234,236]);doc.rect(x,y,tw,rh+.4,"F");}
      else if(r._bg){fill(r._bg);doc.rect(x,y,tw,rh,"F");}
      else if(r._hl){fill([236,238,240]);doc.rect(x,y,tw,rh,"F");}
      else if(i%2===1){fill([248,250,252]);doc.rect(x,y,tw,rh,"F");}
      var cx=x;
      cols.forEach(function(c){
        var v=r[c.k];v=v===undefined||v===null?"":String(v);
        var mw=c.w-3;
        font(7.2,r._total||r._hl||c.b);
        while(v.length>3&&doc.getTextWidth(v)>mw)v=v.slice(0,-2);
        var cor=c.cor?c.cor(r):C.txt;txt(r._total&&!c.cor?C.b:cor);
        doc.text(v,c.al==="r"?cx+c.w-2:c.al==="c"?cx+c.w/2:cx+2,y+rh/2+1.5,{align:c.al==="r"?"right":c.al==="c"?"center":"left"});
        cx+=c.w;
      });
      y+=r._total?rh+.4:rh;
    });
    doc.setDrawColor(C.line[0],C.line[1],C.line[2]);doc.setLineWidth(.25);doc.line(x,y,x+tw,y);
    return y;
  }

  var P=st.P,A=st.acum;
  // ===== PAGINA 1 =====
  var y=header();
  section("Indicadores - "+st.per,y);y+=3.5;
  var ks=[
    ["Prêmio previsto",fmtBRL(P.pot),st.per,C.b],
    ["Total pago",fmtBRL(P.pago),P.linhas.length+" colaboradores",C.grn],
    ["Total perdido",fmtBRL(P.perd),pct1(P.pctPerda)+" do previsto",C.red],
    ["% de ganho",pct1(P.pctGanho),P.ok+" com 100% do prêmio",C.grn],
    ["Perda com faltas",fmtBRL(P.lf),P.nf+" faltas",C.red],
    ["Absenteísmo",pct1(P.abs),P.absF+" faltas no período",C.org]
  ];
  var gap=3.2,kw=(cw-gap*5)/6,kh=21;
  ks.forEach(function(k,i){kpi(mg+i*(kw+gap),y,kw,kh,k[0],k[1],k[2],k[3]);});
  y+=kh+8;
  section("Evolução mês a mês - "+st.selAno,y);y+=3.5;
  var chH=(H-12-y-4)/2;
  chartPanel(st.anoD.length?relCfgGP(st.labels,st.anoD,1.9,st.selIdx):null,mg,y,cw,chH,"Ganho x Perda mês a mês (R$) e % de ganho",C.grn,"Acumulado: pago "+fmtBRL(A.pago)+"  |  perdido "+fmtBRL(A.perd)+"  |  ganho "+pct1(A.pctGanho));
  y+=chH+3;
  chartPanel(st.anoD.length?relCfgPerdas(st.labels,st.anoD,1.9,st.selIdx):null,mg,y,cw,chH,"Perdas com faltas, atrasos e 5S (R$) e absenteísmo",C.red,"Acumulado: perda com faltas "+fmtBRL(A.lf)+"  |  absenteísmo "+pct1(A.abs));

  // ===== PAGINA 2 =====
  doc.addPage();y=header();
  section("Composição das perdas e colaboradores - "+st.per,y,C.red);y+=3.5;
  var pH=66,lw=cw*0.36;
  chartPanel(relCfgComp(P,1.6),mg,y,lw,pH,"Composição das perdas",C.red);
  chartPanel(relCfgColab(P,1.35,10),mg+lw+gap,y,cw-lw-gap,pH,"Maiores perdas por colaborador",C.red,"R$ perdido  ·  % do prêmio");
  y+=pH+8;
  section("Resumo mês a mês - "+st.selAno,y);y+=3;
  var gC=function(){return C.grn;},rC=function(){return C.red;},oC=function(){return C.org;};
  var colsR=[
    {h:"Mês",k:"mes",w:30,b:true,cor:function(){return C.b;}},{h:"Previsto",k:"pot",w:26,al:"r"},{h:"Pago",k:"pago",w:26,al:"r",cor:gC},
    {h:"Perdido",k:"perd",w:26,al:"r",cor:rC},{h:"% Ganho",k:"pg",w:19,al:"r",cor:gC},{h:"% Perda",k:"pp",w:19,al:"r",cor:rC},
    {h:"Perda faltas",k:"lf",w:25,al:"r",cor:rC},{h:"Perda atrasos",k:"la",w:25,al:"r"},{h:"Perda 5S",k:"ls",w:21,al:"r"},
    {h:"Faltas",k:"nf",w:13,al:"c"},{h:"Atrasos",k:"na",w:14,al:"c"}
  ];
  colsR.push({h:"Absenteísmo",k:"abs",w:cw-colsR.reduce(function(a,c){return a+c.w;},0),al:"r",cor:oC});
  function rowR(d,lb){return{mes:lb,pot:fmtBRL(d.pot),pago:fmtBRL(d.pago),perd:fmtBRL(d.perd),pg:pct1(d.pctGanho),pp:pct1(d.pctPerda),lf:fmtBRL(d.lf),la:fmtBRL(d.la),ls:fmtBRL(d.ls),nf:d.nf,na:d.na,abs:pct1(d.abs)};}
  var rowsR=st.anoD.map(function(d,i){var r=rowR(d,fmtM(d.m));r._hl=i===st.selIdx;return r;});
  var tr=rowR(A,"Acumulado "+st.selAno);tr._total=true;rowsR.push(tr);
  table(y,colsR,rowsR,{rh:5.3,titulo:"Resumo mês a mês - "+st.selAno});

  // ===== PAGINA 3+ : colaboradores =====
  doc.addPage();y=header();
  section("Pagamento Cartão Benefício por colaborador - "+st.per,y);y+=3;
  var colsC=[
    {h:"Colaborador",k:"nome",w:62,b:true,cor:function(){return C.b;}},{h:"Função",k:"func",w:40},{h:"C.Custo",k:"cc",w:17,al:"c"},
    {h:"Faltas",k:"f",w:13,al:"c",cor:rC},{h:"Atrasos",k:"a",w:14,al:"c",cor:function(){return [184,130,10];}},{h:"5S",k:"s",w:10,al:"c",cor:function(){return C.pur;}},
    {h:"% Desc.",k:"pct",w:17,al:"r",cor:rC},{h:"Prêmio",k:"val",w:26,al:"r"},{h:"Desconto",k:"desc",w:26,al:"r",cor:rC},
    {h:"A Receber",k:"rec",w:26,al:"r",b:true,cor:gC},{h:"% Ganho",k:"g",w:cw-62-40-17-13-14-10-17-26*3,al:"r",cor:gC}
  ];
  var rowsC=P.linhas.slice().sort(function(a,b){return a.emp.nome.localeCompare(b.emp.nome);}).map(function(x){
    var cc=x.emp.ccid?DB.cc.find(function(c){return c.id===x.emp.ccid;}):null;
    return{nome:x.emp.nome,func:x.emp.func,cc:cc?cc.cod:"-",f:x.f,a:x.a,s:x.s,pct:pct1(x.pct),val:fmtBRL(x.val),desc:x.desc>0.004?"-"+fmtBRL(x.desc):"-",rec:fmtBRL(x.rec),g:pct1(x.val>0?x.rec/x.val*100:0)};
  });
  rowsC.push({_total:true,nome:"TOTAIS ("+P.linhas.length+")",func:"",cc:"",f:P.nf,a:P.na,s:P.ns,pct:pct1(P.pctPerda),val:fmtBRL(P.pot),desc:"-"+fmtBRL(P.perd),rec:fmtBRL(P.pago),g:pct1(P.pctGanho)});
  if(P.linhas.length===0){font(9);txt([170,170,170]);doc.text("Nenhum colaborador com prêmio no período.",mg,y+8);}
  else table(y,colsC,rowsC,{rh:5.8,titulo:"Pagamento Cartão Benefício por colaborador - "+st.per});

  // Rodapes com numeracao
  var n=doc.getNumberOfPages();
  for(var p=1;p<=n;p++){
    doc.setPage(p);
    doc.setDrawColor(C.line[0],C.line[1],C.line[2]);doc.setLineWidth(.3);doc.line(mg,H-9,W-mg,H-9);

var MOSF=["Janeiro","Fevereiro","Marco","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

// Eventos (tempo de empresa + aniversario de vida) de um mes/ano
function anivDoMes(ano,mesIdx){
  var mm=String(mesIdx+1).padStart(2,"0"),emp=[],vida=[];
  DB.emp.filter(ativoVis).forEach(function(e){
    if(e.adm&&e.adm.slice(5,7)===mm){
      var a=ano-parseInt(e.adm.slice(0,4),10);
      if(a>=1)emp.push({e:e,dia:parseInt(e.adm.slice(8,10),10),anos:a,data:e.adm});
    }
    if(e.aniv&&e.aniv.slice(5,7)===mm){
      vida.push({e:e,dia:parseInt(e.aniv.slice(8,10),10),anos:ano-parseInt(e.aniv.slice(0,4),10),data:e.aniv});
    }
  });
  var ord=function(a,b){return a.dia-b.dia||a.e.nome.localeCompare(b.e.nome);};
  emp.sort(ord);vida.sort(ord);
  return {empresa:emp,vida:vida};
}

// ── TELA DE PARABENS (Task 2) ──
function checkAniversarios(){
  var hj=hoje(),mm=mmdd(hj),ano=parseInt(hj.slice(0,4),10),evs=[];
  DB.emp.filter(ativoVis).forEach(function(e){
    if(e.adm&&mmdd(e.adm)===mm){var a=ano-parseInt(e.adm.slice(0,4),10);if(a>=1)evs.push({e:e,tipo:"empresa",anos:a});}
    if(e.aniv&&mmdd(e.aniv)===mm){evs.push({e:e,tipo:"vida",anos:ano-parseInt(e.aniv.slice(0,4),10)});}
  });
  if(!evs.length)return;
  evs.sort(function(a,b){return a.e.nome.localeCompare(b.e.nome);});
  var temEmp=evs.some(function(x){return x.tipo==="empresa";}),temVida=evs.some(function(x){return x.tipo==="vida";});
  var subt=temEmp&&temVida?"Aniversario de vida e de tempo de empresa hoje":temVida?"Aniversario de vida hoje":"Aniversario de tempo de empresa hoje";
  var rows=evs.map(function(x){
    var tag=x.tipo==="empresa"
      ?"<span class='aniv-tag emp'><i class='ti ti-building'></i> "+x.anos+" ano"+(x.anos>1?"s":"")+" de TORR</span>"
      :"<span class='aniv-tag vida'><i class='ti ti-cake'></i> "+x.anos+" ano"+(x.anos!==1?"s":"")+"</span>";
    return "<div class='aniv-row'><div class='aniv-av'>"+ini(x.e.nome)+"</div>"
      +"<div style='min-width:0'><div class='aniv-nm'>"+esc(x.e.nome)+"</div>"
      +"<div class='aniv-fn'>"+esc(x.e.func)+"</div>"+tag+"</div></div>";
  }).join("");
  closeAniv();
  var div=document.createElement("div");div.className="aniv-bg";div.id="md-aniv";
  div.innerHTML="<div class='aniv-card' role='dialog' aria-modal='true'>"
    +"<div class='aniv-hd'><div class='ic'><i class='ti ti-confetti'></i></div>"
    +"<h2>Parabens!</h2><p>"+subt+"</p></div>"
    +"<div class='aniv-bd'>"+rows+"</div>"
    +"<div class='aniv-ft'><button onclick='closeAniv()'><i class='ti ti-check' style='margin-right:5px'></i>Fechar</button></div>"
    +"</div>";
  document.body.appendChild(div);
}
function closeAniv(){var m=document.getElementById("md-aniv");if(m)m.remove();}

// ── CALENDARIO DE ANIVERSARIOS (Task 3) ──
function rCal(){
  var now=new Date();
  var selAno=parseInt(gv("cal-ano"),10);if(isNaN(selAno))selAno=now.getFullYear();
  var selMes=gv("cal-mes");selMes=selMes===""?now.getMonth():parseInt(selMes,10);
  if(isNaN(selMes))selMes=now.getMonth();

  var anoAtual=now.getFullYear(),anos=[];
  for(var y=anoAtual-3;y<=anoAtual+2;y++)anos.push(y);
  var anoOpts=anos.map(function(a){return "<option value='"+a+"'"+(a===selAno?" selected":"")+">"+a+"</option>";}).join("");
  var mesOpts=MOSF.map(function(m,i){return "<option value='"+i+"'"+(i===selMes?" selected":"")+">"+m+"</option>";}).join("");

  var ev=anivDoMes(selAno,selMes);
  var porDia={};
  ev.empresa.forEach(function(x){(porDia[x.dia]=porDia[x.dia]||[]).push({t:"emp",x:x});});
  ev.vida.forEach(function(x){(porDia[x.dia]=porDia[x.dia]||[]).push({t:"vida",x:x});});

  var primeiro=new Date(selAno,selMes,1).getDay();
  var diasNoMes=new Date(selAno,selMes+1,0).getDate();
  var hj=hoje(),mmHj=String(selMes+1).padStart(2,"0"),ehMesAtual=(selAno===now.getFullYear());

  var wd=["Dom","Seg","Ter","Qua","Qui","Sex","Sab"];
  var grid="<div class='cal-grid'>"+wd.map(function(d){return "<div class='cal-wd'>"+d+"</div>";}).join("");
  for(var i=0;i<primeiro;i++)grid+="<div class='cal-cell empty'></div>";
  for(var d=1;d<=diasNoMes;d++){
    var dd=String(d).padStart(2,"0");
    var ehHoje=ehMesAtual&&(selAno+"-"+mmHj+"-"+dd)===hj;
    var evs=porDia[d]||[];
    var pills=evs.map(function(o){
      var nome=nome1(o.x.e);
      if(o.t==="emp")return "<div class='cal-ev emp' title='"+esc(o.x.e.nome)+" - "+o.x.anos+" anos de empresa'><i class='ti ti-building'></i>"+esc(nome)+" ("+o.x.anos+"a)</div>";
      return "<div class='cal-ev vida' title='"+esc(o.x.e.nome)+" - "+o.x.anos+" anos'><i class='ti ti-cake'></i>"+esc(nome)+" ("+o.x.anos+")</div>";
    }).join("");
    grid+="<div class='cal-cell"+(ehHoje?" today":"")+"'><span class='cal-dn'>"+d+"</span>"+pills+"</div>";
  }
  grid+="</div>";

  var selSt="padding:.4rem .75rem;border:1.5px solid #dfe5ee;border-radius:8px;font-size:13px;color:"+B+";font-weight:700;background:#fff";
  var totalEmp=ev.empresa.length,totalVida=ev.vida.length;

  document.getElementById("p-calendario").innerHTML=
    "<div class='pg-hd'><div><h1 class='h1'>Aniversarios</h1>"
    +"<div class='sub'>Tempo de empresa e aniversario de vida &middot; "+MOSF[selMes]+"/"+selAno+"</div></div>"
    +"<button class='btnp btn-ic' onclick='gerarAniversariantesPDF()'"+((totalEmp+totalVida)?"":" disabled")+"><i class='ti ti-printer'></i>Imprimir aniversariantes do mes</button></div>"
    +"<div class='card' style='margin-bottom:1rem'>"
    +"<div style='display:flex;gap:12px;flex-wrap:wrap;align-items:center'>"
    +"<div style='display:flex;align-items:center;gap:8px'><i class='ti ti-calendar' style='color:#888;font-size:16px'></i>"
    +"<span style='font-size:12px;font-weight:600;color:#555'>Mes:</span><select id='cal-mes' onchange='rCal()' style='"+selSt+"'>"+mesOpts+"</select></div>"
    +"<div style='display:flex;align-items:center;gap:8px'><span style='font-size:12px;font-weight:600;color:#555'>Ano:</span><select id='cal-ano' onchange='rCal()' style='"+selSt+"'>"+anoOpts+"</select></div>"
    +"<div style='display:flex;gap:16px;margin-left:auto;flex-wrap:wrap'>"
    +"<span class='cal-leg'><span class='cal-dot' style='background:#3a4046'></span>Tempo de empresa <b style='color:"+B+"'>("+totalEmp+")</b></span>"
    +"<span class='cal-leg'><span class='cal-dot' style='background:#1a7a4a'></span>Aniversario de vida <b style='color:"+GRN+"'>("+totalVida+")</b></span>"
    +"</div></div></div>"
    +"<div class='card'>"+grid+"</div>";
}

// ── PDF: ANIVERSARIANTES DO MES (Task 6) ──
function gerarAniversariantesPDF(){
  var now=new Date();
  var selAno=parseInt(gv("cal-ano"),10);if(isNaN(selAno))selAno=now.getFullYear();
  var selMes=gv("cal-mes");selMes=selMes===""?now.getMonth():parseInt(selMes,10);if(isNaN(selMes))selMes=now.getMonth();
  var ev=anivDoMes(selAno,selMes);
  if(!ev.empresa.length&&!ev.vida.length){alert("Nao ha aniversariantes em "+MOSF[selMes]+"/"+selAno+".");return;}

  var K=mkPdfKit("Aniversariantes do Mes",MOSF[selMes]+" / "+selAno),doc=K.doc,C=K.C;
  var y=K.header();
  function ccCod(e){var c=e.ccid?DB.cc.find(function(x){return x.id===e.ccid;}):null;return c?c.cod:"-";}

  // Cartoes-resumo
  var cw=(K.cw-8)/2;
  K.kpi(K.mg,y,cw,20,"Aniversario de tempo de empresa",String(ev.empresa.length),ev.empresa.length===1?"colaborador":"colaboradores",C.bl);
  K.kpi(K.mg+cw+8,y,cw,20,"Aniversario de vida",String(ev.vida.length),ev.vida.length===1?"colaborador":"colaboradores",C.grn);
  y+=27;

  // Secao 1 — Tempo de empresa (azul)
  K.section("Aniversario de tempo de empresa - "+MOSF[selMes]+"/"+selAno,y,C.bl);y+=4;
  if(ev.empresa.length){
    var colsE=[
      {h:"Dia",k:"dia",w:16,al:"c",b:true},
      {h:"Colaborador",k:"nome",w:88,b:true},
      {h:"Funcao",k:"func",w:70},
      {h:"C.Custo",k:"cc",w:26,al:"c"},
      {h:"Admissao",k:"adm",w:32,al:"c"},
      {h:"Completa",k:"anos",w:K.cw-16-88-70-26-32,al:"c",b:true,cor:function(){return C.bl;}}
    ];
    var rowsE=ev.empresa.map(function(x){return {dia:String(x.dia).padStart(2,"0"),nome:x.e.nome,func:x.e.func,cc:ccCod(x.e),adm:fmtD(x.data),anos:x.anos+" ano"+(x.anos>1?"s":"")};});
    y=K.table(y,colsE,rowsE,{rh:5.8,titulo:"Aniversario de tempo de empresa",cor:C.bl});
  }else{K.font(8.5);K.txt([170,170,170]);doc.text("Nenhum aniversario de tempo de empresa neste mes.",K.mg,y+6);y+=10;}
  y+=8;

  // Secao 2 — Aniversario de vida (verde)
  if(y>K.H-40){doc.addPage();y=K.header();}
  K.section("Aniversario de vida - "+MOSF[selMes]+"/"+selAno,y,C.grn);y+=4;
  if(ev.vida.length){
    var colsV=[
      {h:"Dia",k:"dia",w:16,al:"c",b:true},
      {h:"Colaborador",k:"nome",w:88,b:true},
      {h:"Funcao",k:"func",w:70},
      {h:"C.Custo",k:"cc",w:26,al:"c"},
      {h:"Data",k:"data",w:32,al:"c"},
      {h:"Idade",k:"anos",w:K.cw-16-88-70-26-32,al:"c",b:true,cor:function(){return C.grn;}}
    ];
    var rowsV=ev.vida.map(function(x){return {dia:String(x.dia).padStart(2,"0"),nome:x.e.nome,func:x.e.func,cc:ccCod(x.e),data:fmtD(x.data),anos:(x.anos>=0?x.anos+" anos":"-")};});
    y=K.table(y,colsV,rowsV,{rh:5.8,titulo:"Aniversario de vida",cor:C.grn});
  }else{K.font(8.5);K.txt([170,170,170]);doc.text("Nenhum aniversario de vida neste mes.",K.mg,y+6);}

  K.finalizar("aniversariantes-"+selAno+"-"+String(selMes+1).padStart(2,"0")+".pdf");
}


// ═══════════════════════════════════════
// BACKUP AUTOMATICO
// Copias ficam no proprio Supabase (tabela torr_dados, linhas bkp_*),
// 1 automatica por dia no primeiro acesso, guardando as ultimas BKP_MAX.
// ═══════════════════════════════════════
var BKP_MAX=30,BKP_LISTA=null,BKP_ERRO="";
function bkpDocs(){return _db.collection("torr");}
function bkpNovoId(){
  var d=new Date(),z=function(n){return String(n).padStart(2,"0");};
  return d.getFullYear()+z(d.getMonth()+1)+z(d.getDate())+"_"+z(d.getHours())+z(d.getMinutes())+z(d.getSeconds());
}
function bkpDataId(id){return id.slice(6,8)+"/"+id.slice(4,6)+"/"+id.slice(0,4)+" "+id.slice(9,11)+":"+id.slice(11,13);}
function bkpTam(n){return n>=1048576?(n/1048576).toLocaleString("pt-BR",{maximumFractionDigits:1})+" MB":Math.max(1,Math.round(n/1024))+" KB";}
function bkpListar(){
  return bkpDocs().doc("_backups").get().then(function(s){BKP_LISTA=s.exists?(s.data().lista||[]):[];return BKP_LISTA;});
}
function bkpCriar(tipo){
  if(!window._dbLoaded)return Promise.reject(new Error("Os dados ainda nao foram carregados."));
  var id=bkpNovoId(),snap=JSON.parse(JSON.stringify(DB)),cont={};
  COLECOES.forEach(function(c){cont[c]=(snap[c]||[]).length;});
  var meta={id:id,criado:new Date().toISOString(),tipo:tipo,cont:cont,tam:JSON.stringify(snap).length};
  return Promise.all(COLECOES.map(function(c){
    return bkpDocs().doc("bkp_"+id+"_"+c).set({dados:snap[c]||[],criado:meta.criado});
  })).then(bkpListar).then(function(lista){
    lista=lista.filter(function(x){return x.id!==id;});
    lista.unshift(meta);
    var sobra=lista.slice(BKP_MAX);lista=lista.slice(0,BKP_MAX);
    return bkpDocs().doc("_backups").set({lista:lista,atualizado:meta.criado}).then(function(){
      BKP_LISTA=lista;
      return Promise.all(sobra.map(function(r){return bkpApagarDocs(r.id);}));
    });
  }).then(function(){return meta;});
}
function bkpApagarDocs(id){
  return Promise.all(COLECOES.map(function(c){return bkpDocs().doc("bkp_"+id+"_"+c).delete().catch(function(){});}));
}
function bkpLer(id){
  return Promise.all(COLECOES.map(function(c){return bkpDocs().doc("bkp_"+id+"_"+c).get();})).then(function(snaps){
    var dados={};
    snaps.forEach(function(s,i){if(s.exists)dados[COLECOES[i]]=s.data().dados||[];});
    return dados;
  });
}
// Backup automatico: 1 por dia, no primeiro acesso
function autoBackup(){
  if(!window._dbLoaded)return;
  if(DB.emp.length===0&&DB.oc.length===0)return; // nunca guarda uma base vazia como backup
  var hojeId=bkpNovoId().slice(0,8);
  bkpListar().then(function(lista){
    if(lista.some(function(x){return x.tipo==="auto"&&x.id.slice(0,8)===hojeId;}))return null;
    return bkpCriar("auto").then(function(){BKP_ERRO="";});
  }).then(function(){
    bkpCopiaLocalSemanal();
    if(pg==="backup")rBkp();
  }).catch(function(e){
    BKP_ERRO=e.message||String(e);
    console.warn("Backup automatico falhou:",e);
  });
}
// Copia no computador (opcional, 1x por semana) - protege mesmo se a conta do Supabase tiver problema
function bkpLocalAtivo(){try{return localStorage.getItem("torr_bkp_local")==="1";}catch(e){return false;}}
function bkpCopiaLocalSemanal(){
  if(!bkpLocalAtivo())return;
  var ult=0;try{ult=parseInt(localStorage.getItem("torr_bkp_local_ult")||"0",10);}catch(e){}
  if(Date.now()-ult<7*24*3600*1000)return;
  bkpBaixarAtual();
  try{localStorage.setItem("torr_bkp_local_ult",String(Date.now()));}catch(e){}
}
function setBkpLocal(on){try{localStorage.setItem("torr_bkp_local",on?"1":"0");}catch(e){}rBkp();}
function bkpDownload(obj,nome){
  var blob=new Blob([JSON.stringify(obj)],{type:"application/json"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=nome;
  document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);
}
function bkpPacote(dados,origem){return{sistema:"TORR Equipamentos - Gestao de Premios",versao:1,origem:origem,gerado:new Date().toISOString(),colecoes:COLECOES,dados:dados};}
function bkpBaixarAtual(){
  if(!window._dbLoaded){alert("Os dados ainda nao foram carregados.");return;}
  bkpDownload(bkpPacote(DB,"dados atuais"),"backup-torr-"+bkpNovoId()+".json");
}
function bkpBaixar(id){
  showSync("Preparando download...",false);
  bkpLer(id).then(function(d){
    bkpDownload(bkpPacote(d,"backup "+id),"backup-torr-"+id+".json");
    showSync("Download iniciado",true);
    setTimeout(function(){document.getElementById("sync-bar").style.display="none";},2500);
  }).catch(function(e){showSync("Erro: "+e.message,false,true);});
}
function bkpAgora(){
  showSync("Criando backup...",false);
  bkpCriar("manual").then(function(){
    showSync("Backup criado",true);BKP_ERRO="";
    setTimeout(function(){document.getElementById("sync-bar").style.display="none";},2500);rBkp();
  }).catch(function(e){BKP_ERRO=e.message;showSync("Erro no backup: "+e.message,false,true);rBkp();});
}
// Restaura: antes cria um backup de seguranca do estado atual
function bkpAplicar(dados,origem){
  var n=(dados.emp||[]).length,m=(dados.oc||[]).length;
  if(!confirm("Restaurar "+origem+"?\n\nColaboradores: "+n+"  |  Lancamentos: "+m+"\n\nOs dados atuais serao substituidos. Antes disso, um backup de seguranca do estado atual sera criado automaticamente."))return;
  showSync("Criando backup de seguranca...",false);
  bkpCriar("antes-restauracao").then(function(){
    COLECOES.forEach(function(c){if(Array.isArray(dados[c]))DB[c]=dados[c];});
    showSync("Restaurando...",false);
    return window._fbSave();
  }).then(function(){
    showSync("Backup restaurado com sucesso",true);
    setTimeout(function(){document.getElementById("sync-bar").style.display="none";},3000);
    rBkp();
  }).catch(function(e){showSync("Erro ao restaurar: "+e.message,false,true);});
}
function bkpRestaurar(id){
  showSync("Lendo backup...",false);
  bkpLer(id).then(function(d){
    document.getElementById("sync-bar").style.display="none";
    if(!d.emp){alert("Backup incompleto ou nao encontrado.");return;}
    bkpAplicar(d,"o backup de "+bkpDataId(id));
  }).catch(function(e){showSync("Erro: "+e.message,false,true);});
}
function bkpExcluir(id){
  if(!confirm("Excluir o backup de "+bkpDataId(id)+"?"))return;
  bkpListar().then(function(lista){
    lista=lista.filter(function(x){return x.id!==id;});
    return bkpDocs().doc("_backups").set({lista:lista,atualizado:new Date().toISOString()}).then(function(){BKP_LISTA=lista;return bkpApagarDocs(id);});
  }).then(rBkp).catch(function(e){showSync("Erro: "+e.message,false,true);});
}
function bkpImportar(inp){
  var f=inp.files&&inp.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    inp.value="";
    try{
      var o=JSON.parse(r.result),d=o&&o.dados;
      if(!d||!Array.isArray(d.emp))throw new Error("Arquivo nao e um backup valido do sistema.");
      bkpAplicar(d,"o arquivo "+f.name+(o.gerado?" (gerado em "+new Date(o.gerado).toLocaleString("pt-BR")+")":""));
    }catch(e){alert("Nao foi possivel ler o arquivo: "+e.message);}
  };
  r.readAsText(f);
}

function rBkp(){
  var el=document.getElementById("p-backup");if(!el)return;
  var lista=BKP_LISTA;
  var ultAuto=lista?lista.find(function(x){return x.tipo==="auto";}):null;
  var tipoLb={auto:["AUTOMATICO","bdg-ok"],manual:["MANUAL","bdg-off"],"antes-restauracao":["ANTES DE RESTAURAR","bdg-dem"]};
  var rows=lista===null?"<div class='empty'><i class='ti ti-loader'></i>Carregando backups...</div>":
    lista.length===0?"<div class='empty'><i class='ti ti-database-off'></i>Nenhum backup ainda. O primeiro sera criado automaticamente hoje, ou clique em Fazer backup agora.</div>":
    "<div style='overflow-x:auto'><table style='min-width:760px'><thead><tr style='background:"+B+";color:#fff'>"
    +"<th>Data e hora</th><th>Tipo</th><th style='text-align:center'>Colaboradores</th><th style='text-align:center'>Lancamentos</th><th style='text-align:center'>Infracoes 5S</th><th style='text-align:right'>Tamanho</th><th style='text-align:right'>Acoes</th></tr></thead><tbody>"
    +lista.map(function(x){
      var tl=tipoLb[x.tipo]||[x.tipo,"bdg-off"],c=x.cont||{};
      return "<tr><td style='font-weight:700;color:"+B+"'>"+bkpDataId(x.id)+"</td>"
        +"<td><span class='bdg "+tl[1]+"'>"+tl[0]+"</span></td>"
        +"<td style='text-align:center'>"+(c.emp||0)+"</td><td style='text-align:center'>"+(c.oc||0)+"</td><td style='text-align:center'>"+(c.oc5||0)+"</td>"
        +"<td style='text-align:right;color:#888'>"+bkpTam(x.tam||0)+"</td>"
        +"<td style='text-align:right;white-space:nowrap'>"
        +"<button class='ibedt' title='Baixar (.json)' onclick=\"bkpBaixar('"+x.id+"')\"><i class='ti ti-download'></i></button>"
        +"<button class='btng btn-ic' style='padding:.3rem .65rem;margin:0 4px' onclick=\"bkpRestaurar('"+x.id+"')\"><i class='ti ti-restore'></i>Restaurar</button>"
        +"<button class='ibdel' title='Excluir' onclick=\"bkpExcluir('"+x.id+"')\"><i class='ti ti-trash'></i></button></td></tr>";
    }).join("")+"</tbody></table></div>";
  var local=bkpLocalAtivo();
  el.innerHTML=
    "<div class='pg-hd'><div><h1 class='h1'>Backup dos dados</h1><div class='sub'>Copias automaticas diarias com restauracao</div></div>"
    +"<div style='display:flex;gap:8px;flex-wrap:wrap'>"
    +"<button class='btng btn-ic' onclick='bkpBaixarAtual()'><i class='ti ti-download'></i>Baixar dados atuais (.json)</button>"
    +"<label class='btng btn-ic' style='cursor:pointer'><i class='ti ti-upload'></i>Restaurar de arquivo<input type='file' accept='.json,application/json' onchange='bkpImportar(this)' style='display:none'/></label>"
    +"<button class='btnp btn-ic' onclick='bkpAgora()'><i class='ti ti-database-plus'></i>Fazer backup agora</button></div></div>"
    +(BKP_ERRO?"<div class='warn' style='margin-bottom:1rem;background:#fbe9e7;color:#a93226'><i class='ti ti-alert-triangle'></i> Ultimo backup automatico falhou: "+esc(BKP_ERRO)+". Verifique a conexao e as regras de seguranca (RLS) do Supabase.</div>":"")
    +"<div class='ga' style='margin-bottom:1rem'>"
    +sCard("Ultimo backup automatico",ultAuto?bkpDataId(ultAuto.id):"—",GRN,"ti-clock-check",ultAuto?"criado no primeiro acesso do dia":"ainda nao criado")
    +sCard("Backups guardados",(lista?lista.length:0)+" / "+BKP_MAX,B,"ti-database","os mais antigos sao apagados")
    +sCard("Copia no computador",local?"Ativada":"Desativada",local?GRN:"#6b7580","ti-device-desktop","1x por semana (.json)")
    +"</div>"
    +"<div class='card' style='margin-bottom:1rem'>"
    +"<div style='display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap'>"
    +"<div style='font-size:13px;color:#555;line-height:1.6;max-width:760px'>"
    +"<b style='color:"+B+"'>Como funciona:</b> no primeiro acesso de cada dia, o sistema guarda uma copia completa dos dados no Supabase e mantem as "+BKP_MAX+" mais recentes. "
    +"Ao restaurar, uma copia do estado atual e criada antes, para poder desfazer. "
    +"A copia semanal no computador baixa um arquivo .json para a pasta Downloads deste computador.</div>"
    +"<div class='seg'><button class='seg-b"+(local?" on":"")+"' onclick='setBkpLocal(true)'>Copia semanal ligada</button><button class='seg-b"+(local?"":" on")+"' onclick='setBkpLocal(false)'>Desligada</button></div>"
    +"</div></div>"
    +"<div class='card'><div style='font-weight:700;font-size:15px;color:"+B+";margin-bottom:.75rem'>Backups guardados</div>"+rows+"</div>";
  if(lista===null)bkpListar().then(rBkp).catch(function(e){BKP_ERRO=e.message;BKP_LISTA=[];rBkp();});
}
