<script>
// ═══ CONFIGURACAO — TORR EQUIPAMENTOS ═══
// A chave "anon" abaixo e PUBLICA por natureza (fica no navegador de qualquer forma).
// Quem protege os dados e o RLS do Supabase (arquivo supabase_setup.sql).
// Impede que o sistema seja aberto dentro de outro site (clickjacking).
if(window.top!==window.self){try{window.top.location=window.self.location;}catch(e){document.documentElement.style.display="none";}}
// NUNCA coloque aqui a chave "service_role".
var SUPABASE_URL = "https://fxqvwkbfdwsmkisyeltk.supabase.co";
var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ4cXZ3a2JmZHdzbWtpc3llbHRrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExNDA3MjUsImV4cCI6MjEwNjcxNjcyNX0.Tmge7ZNsYFcUeqIdXDmo401n7fdf4FC98VbmUYDfzEY";
// Usuario MASTER guardado apenas como hash SHA-256 (o e-mail nao fica exposto no codigo publico).
// Os demais usuarios e permissoes ficam na tabela torr_usuarios (tela Acessos e Permissoes).
// A protecao real e o RLS no Supabase (arquivo supabase_setup.sql).
var MASTER_HASH = "408321e51aa64c6d92388b1a2cc964d94ffde0d7041a9cef4be8fc7ec61fb3ca";
var TABELA = "torr_dados";
var MINUTOS_INATIVIDADE = 30;                   // sai sozinho apos X minutos parado

var _sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: {
    persistSession: true,
    // "Lembrar senha" marcado: sessao fica salva neste computador (localStorage).
    // Desmarcado: fechou a aba/navegador = precisa logar de novo (sessionStorage).
    storage: {
      getItem: function(k){ try{ return (localStorage.getItem("torr_lembrar")==="1"?localStorage:sessionStorage).getItem(k); }catch(e){ return null; } },
      setItem: function(k,v){ try{ (localStorage.getItem("torr_lembrar")==="1"?localStorage:sessionStorage).setItem(k,v); }catch(e){} },
      removeItem: function(k){ try{ localStorage.removeItem(k); sessionStorage.removeItem(k); }catch(e){} }
    },
    autoRefreshToken: true,
    detectSessionInUrl: false
  }
});

function _chk(r){ if(r.error) throw new Error(r.error.message); return r.data; }
function _sha256(s){
  return crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)).then(function(b){
    return Array.prototype.map.call(new Uint8Array(b),function(x){return ("0"+x.toString(16)).slice(-2);}).join("");
  });
}


// Camada compativel com o codigo antigo: _db.collection(x).doc(id).get/set/delete
var _db = {
  collection: function(){
    return { doc: function(id){
      return {
        get: function(){
          return _sb.from(TABELA).select("conteudo").eq("id", id).maybeSingle().then(function(r){
            var d = _chk(r);
            return { exists: !!d, data: function(){ return d ? d.conteudo : undefined; } };
          });
        },
        set: function(obj){
          return _sb.from(TABELA).upsert({ id: id, conteudo: obj, atualizado: new Date().toISOString() }).then(_chk);
        },
        delete: function(){
          return _sb.from(TABELA).delete().eq("id", id).then(_chk);
        }
      };
    } };
  }
};

// Cada tabela em uma linha separada
var COLECOES = ["emp","oc","pr","idx","cc","oc5","motivos","sensos","motdem","motafas","reaj","grupos","receita","folhafech"];

window._fbLoad = function(){
  return _sb.from(TABELA).select("id,conteudo").in("id", COLECOES).then(function(r){
    var rows = _chk(r) || [], mapa = {};
    rows.forEach(function(x){ mapa[x.id] = x.conteudo; });
    window._lastSaved = {}; window._seeded = {};
    COLECOES.forEach(function(col){
      window.DB[col] = (mapa[col] && mapa[col].dados) || [];
      window._lastSaved[col] = JSON.stringify(window.DB[col]); // linha ausente ou sem permissao de leitura = "[]" (nao regrava vazio)
    });
    var _antes = {}; ["sensos","motdem","grupos","motafas"].forEach(function(c){ _antes[c] = (window.DB[c]||[]).length; });
    if(!window.DB.sensos || window.DB.sensos.length === 0){
      window.DB.sensos = window.initSensos();
    }
    if((!window.DB.motdem || window.DB.motdem.length === 0) && window.initMotDem){
      window.DB.motdem = window.initMotDem();
    }
    if((!window.DB.grupos || window.DB.grupos.length === 0) && window.initGrupos){
      window.DB.grupos = window.initGrupos();
    }
    if((!window.DB.motafas || window.DB.motafas.length === 0) && window.initMotAfas){
      window.DB.motafas = window.initMotAfas();
    }
    ["sensos","motdem","grupos","motafas"].forEach(function(c){ if(!_antes[c] && (window.DB[c]||[]).length) window._seeded[c] = true; });
    window._dbLoaded = true;
  });
};

// Grava somente as colecoes que mudaram (o Supabase confere a permissao de cada uma)
window._fbSave = function(){
  var agora = new Date().toISOString(), ls = window._lastSaved || {};
  var mud = COLECOES.filter(function(col){ return JSON.stringify(window.DB[col] || []) !== ls[col]; });
  if(!mud.length) return Promise.resolve();
  return Promise.all(mud.map(function(col){
    var js = JSON.stringify(window.DB[col] || []);
    return _sb.from(TABELA).upsert({ id: col, conteudo: { dados: window.DB[col] || [], updated: agora }, atualizado: agora }).then(function(r){
      if(r.error) return { col: col, msg: r.error.message };
      ls[col] = js; if(window._seeded) delete window._seeded[col]; return null;
    });
  })).then(function(res){
    var erros = res.filter(function(x){ return x && !(window._seeded && window._seeded[x.col]); });

.ro-mode button[onclick^="aplTodos"],.ro-mode #ptodos,.ro-mode #p-motivos .btnp,.ro-mode #p-motivos .btng,
.ro-mode #p-direcionar .dir-bar,.ro-mode #p-backup .seg{display:none!important}
.ro-mode .etab-sal,.ro-mode .etab-cc,.ro-mode #p-premios input[type=number],.ro-mode #p-motivos input,.ro-mode #p-direcionar tbody tr{pointer-events:none}
.ro-mode .etab-sal{background:transparent!important}
.ro-mode .pg-hd .sub::after{content:"  ·  somente visualizacao";color:#8a5a00;font-weight:700}
.lg-opts{display:flex;justify-content:space-between;align-items:center;margin:-.2rem 0 .9rem}
.lg-chk{display:flex;align-items:center;gap:7px;font-size:12.5px;color:#555;cursor:pointer;user-select:none}
.lg-chk input{width:auto;margin:0;accent-color:var(--deep)}
.etab-hd{display:flex;align-items:center;justify-content:space-between;gap:6px}
.etab th.c .etab-hd{justify-content:center}
.etab th:hover{background:#4d545b}
.etab th.cu:hover{background:#3a3f44}
.etab-dt{text-align:center!important;min-width:118px}
.etab-fil{display:flex;align-items:center;gap:8px;background:#eceef0;color:var(--deep);border-radius:8px;padding:.45rem .7rem;font-size:12px;font-weight:700;margin-bottom:.6rem}
.etab-fil button{margin-left:auto;background:#fff;border:1px solid var(--line);border-radius:6px;padding:.25rem .6rem;font-size:12px;font-weight:700;color:var(--deep)}
.etab-menu{position:fixed;z-index:9900;width:260px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 40px rgba(20,22,24,.22);padding:.45rem;max-height:calc(100vh - 16px);overflow:auto;font-size:13px}
.etab-menu>button{display:flex;align-items:center;gap:8px;width:100%;background:none;border:none;border-radius:6px;padding:.45rem .55rem;text-align:left;font-size:13px;color:#2a2e33}
.etab-menu>button:hover{background:#f2f3f5;color:var(--deep)}
.etab-menu>button i{font-size:16px;color:var(--deep)}
.etab-mt{font-size:10.5px;font-weight:800;color:#8a94a0;text-transform:uppercase;letter-spacing:.5px;padding:.35rem .55rem .25rem}
.etab-msep{height:1px;background:var(--line);margin:.35rem 0}
.etab-mbusca{margin:.15rem 0 .35rem;padding:.4rem .6rem!important;font-size:12.5px!important}
.etab-mvals{max-height:210px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:.2rem 0}
.etab-mchk{display:flex;align-items:center;gap:8px;padding:.28rem .55rem;font-size:12.5px;cursor:pointer;color:#333}
.etab-mchk:hover{background:#f1f4f8}
.etab-mchk input{width:auto;margin:0}
.etab-mchk.tudo{font-weight:700}
.etab-mft{display:flex;justify-content:flex-end;gap:6px;margin-top:.5rem}
.etab-mft .btnp,.etab-mft .btng{padding:.4rem .8rem;font-size:12px}
@media (max-width:900px){#main{padding:1rem}}
/* ===== Logo TORR ===== */
.lg-plate{background:#fff;border-radius:12px;padding:14px 18px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
#loading-screen .lg-load{width:120px;max-width:40vw;height:auto;display:block}
.lg-login{width:118px;max-width:100%;height:auto;display:block;margin:0 auto}
.lg-card{background:linear-gradient(var(--blue),var(--blue)) top/100% 5px no-repeat,#fff}
#sb .sb-hd{background:#fff;border-bottom:3px solid var(--blue);min-height:0;padding:.7rem .6rem .6rem .75rem}
#sb .sb-icon{width:34px;height:34px;display:none;object-fit:contain}
#sb .sb-word{width:150px;max-width:100%;height:auto;display:block;margin:0 auto}
#sb .sb-app{color:#5a6168;font-weight:600}
#sb .sb-tog{color:#8a9096}
#sb .sb-tog:hover{color:var(--blue)}
#sb.col .sb-icon{display:block}
#lgw::after{background:linear-gradient(90deg,var(--deep),var(--blue))}
.h1,.mdl-tt{color:var(--ink)}
.nb.on{background:rgba(255,255,255,.10)}
</style>
</head>

<script>
// ═══════════════════════════════════════
// DB GLOBAL
// ═══════════════════════════════════════
var DB={emp:[],oc:[],pr:[],idx:[],cc:[],oc5:[],motivos:[],sensos:[],motdem:[],motafas:[],reaj:[],grupos:[],receita:[],folhafech:[]};
var SAVE_TIMER=null;

function dbLoad(){
  return window._fbLoad();
}

function dbSave(){
  if(ACESSO&&!ACESSO.master&&permTela(pg)!=="editar"){
    showSync("Voce tem permissao somente para visualizar esta tela. Nada foi gravado.",false,true);
    window._fbLoad().then(function(){go(pg);});
    return;
  }
  if(!window._dbLoaded){
    showSync("Os dados nao foram carregados do servidor. Recarregue a pagina antes de salvar.",false,true);
    return;
  }
  clearTimeout(SAVE_TIMER);
  showSync("Salvando...",false);
  SAVE_TIMER=setTimeout(function(){
    if(!window._fbSave){
      showSync("Servidor nao carregado!",false,true);
      return;
    }
    window._fbSave().then(function(){
      var t=new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
      showSync("Salvo "+t,true);
      setTimeout(function(){document.getElementById("sync-bar").style.display="none";},3000);
    }).catch(function(e){
      showSync("Erro: "+e.message,false,true);
    });
  },600);
}

function showSync(msg,ok,err){
  var bar=document.getElementById("sync-bar");
  var spin=document.getElementById("sync-spin");
  var txt=document.getElementById("sync-msg");
  bar.style.display="flex";
  bar.className="sync-bar"+(ok?" ok":err?" err":"");
  spin.style.display=(ok||err)?"none":"inline-block";
  txt.textContent=msg;
}

// ═══════════════════════════════════════
// LOGIN
// ═══════════════════════════════════════
function toggleSenha(){
  var inp=document.getElementById("lp");
  var icon=document.getElementById("eye-icon");
  if(inp.type==="password"){
    inp.type="text";
    icon.className="ti ti-eye-off";
  }else{
    inp.type="password";
    icon.className="ti ti-eye";
  }
}
var _loginOcupado=false;
function doLogin(){
  if(_loginOcupado)return;
  var u=document.getElementById("lu").value.trim().toLowerCase();
  var p=document.getElementById("lp").value;
  var err=document.getElementById("lerr");
  var btn=document.getElementById("btn-login");
  err.style.display="none";
  function falha(msg){err.textContent=msg;err.style.display="block";}
  if(!u||!p){falha("Informe e-mail e senha.");return;}
  _loginOcupado=true;btn.disabled=true;
  var lembrar=!!(document.getElementById("lrem")&&document.getElementById("lrem").checked);
  try{
    if(lembrar){localStorage.setItem("torr_lembrar","1");localStorage.setItem("torr_email",u);}
    else{localStorage.removeItem("torr_lembrar");localStorage.removeItem("torr_email");}
  }catch(e){}
  showSync("Entrando...",false);
  _sb.auth.signInWithPassword({email:u,password:p}).then(function(r){
    if(r.error)throw r.error;
    return carregarAcesso(r.data&&r.data.user).then(function(ac){
      if(!ac){_sb.auth.signOut();throw new Error("sem-acesso");}
      ACESSO=ac;
      document.getElementById("lp").value="";
      return entrarApp();
    });
  }).catch(function(e){
    document.getElementById("sync-bar").style.display="none";
    var m=(e&&e.message||"").toLowerCase();
    falha(m.indexOf("rate")>=0||m.indexOf("too many")>=0?"Muitas tentativas. Aguarde alguns minutos.":
          m.indexOf("fetch")>=0||m.indexOf("network")>=0?"Sem conexão com o servidor.":
          m.indexOf("not confirmed")>=0?"E-mail ainda não confirmado no Supabase.":
          m.indexOf("sem-acesso")>=0?"Este e-mail não tem acesso liberado. Fale com o administrador.":"E-mail ou senha incorretos");
  }).then(function(){_loginOcupado=false;btn.disabled=false;});
}
// Sai sozinho apos um tempo sem uso (protege computador compartilhado)
var _inatTimer=null;
function _lembrando(){try{return localStorage.getItem("torr_lembrar")==="1";}catch(e){return false;}}
function _resetInat(){
  if(!window._dbLoaded||_lembrando())return;
  clearTimeout(_inatTimer);
  _inatTimer=setTimeout(function(){
    doLogout();
    var err=document.getElementById("lerr");
    err.textContent="Sessão encerrada por inatividade. Entre novamente.";err.style.display="block";
  },MINUTOS_INATIVIDADE*60*1000);
}
["click","keydown","mousemove","touchstart","scroll"].forEach(function(ev){
  document.addEventListener(ev,_resetInat,{passive:true});
});

// Carrega os dados e abre o sistema
function entrarApp(){
  showSync("Carregando dados...",false);
  return window._fbLoad().then(function(){
    document.getElementById("loading-screen").style.display="none";
    document.getElementById("lgw").style.display="none";
    document.getElementById("app").style.display="flex";
    document.getElementById("lp").value="";
    showSync("Dados carregados",true);
    setTimeout(function(){document.getElementById("sync-bar").style.display="none";},3000);
    aplicarPermissoes();
    var t0=primeiraTela();
    if(!t0){throw new Error("Nenhuma tela liberada para este usuario.");}
    go(t0);
    if(typeof checkAniversarios==="function"&&permTela("employees")!=="nenhum")setTimeout(checkAniversarios,400);
    _resetInat();
    if(typeof autoBackup==="function"&&permTela("backup")==="editar")setTimeout(autoBackup,1500);
  }).catch(function(e){
    showSync("Erro ao carregar os dados. Verifique a conexão ou a permissão da conta.",false,true);
    _sb.auth.signOut().catch(function(){});
    document.getElementById("loading-screen").style.display="none";
    document.getElementById("lgw").style.display="flex";
  });
}
function doLogout(){
  _sb.auth.signOut().catch(function(){});
  clearTimeout(_inatTimer);clearTimeout(SAVE_TIMER);
  // limpa os dados da memoria ao sair
  window._dbLoaded=false;ACESSO=null;ACS_LISTA=null;window._lastSaved={};
  Object.keys(DB).forEach(function(k){DB[k]=[];});
  BKP_LISTA=null;
  try{sessionStorage.clear();}catch(e){}
  // apaga calculos guardados dos relatorios (continham nomes e valores)
  ["_dashStats","_monStats","_relStats","_dashNoPeriodo","_dashML"].forEach(function(k){try{delete window[k];}catch(e){window[k]=undefined;}});
  ["host-5s","md-drill","md-dem","md-afast","md-emppdf","emod","md-aniv","md-reaj","etab-menu","md-grp","md-acs"].forEach(function(id){var el=document.getElementById(id);if(el)el.remove();});
  if(typeof killCH==="function")killCH();
  document.querySelectorAll(".page").forEach(function(pgEl){pgEl.innerHTML="";});
  document.querySelectorAll(".mdl-bg.open,.aniv-bg").forEach(function(m){if(m.classList.contains("aniv-bg"))m.remove();else m.classList.remove("open");});
  document.getElementById("app").style.display="none";
  document.getElementById("lgw").style.display="flex";
  document.getElementById("lu").value="";
  document.getElementById("lp").value="";
  document.getElementById("lerr").style.display="none";
  prepararLogin();
}
// Se a sessao expirar ou for encerrada em outra aba, fecha o sistema
_sb.auth.onAuthStateChange(function(ev){
  if(ev==="SIGNED_OUT"&&window._dbLoaded)doLogout();
});

// ═══════════════════════════════════════
// STARTUP — aguarda Supabase ficar pronto
// ═══════════════════════════════════════
function prepararLogin(){
  try{
    var em=localStorage.getItem("torr_email"),lb=localStorage.getItem("torr_lembrar")==="1";
    var r=document.getElementById("lrem");if(r)r.checked=lb;
    if(em){document.getElementById("lu").value=em;}
  }catch(e){}
}
function startApp(){
  prepararLogin();
  var ls=document.getElementById("loading-screen");
  // Nenhum dado e lido antes do login
  _sb.auth.getSession().then(function(r){
    var s=r&&r.data&&r.data.session;
    return (s?carregarAcesso(s.user):Promise.resolve(null)).then(function(ac){
      if(s&&ac){ACESSO=ac;entrarApp();return;}
      if(s)_sb.auth.signOut();
      ls.style.display="none";document.getElementById("lgw").style.display="flex";
    });
  }).catch(function(){
    ls.style.display="none";document.getElementById("lgw").style.display="flex";
  });
}
if(window._fbReady){
  startApp();
}else{
  document.addEventListener("fb-ready",startApp);
  setTimeout(function(){
    if(!window._fbReady){
      document.getElementById("load-msg").textContent="Erro de conexao. Verifique a internet.";
    }
  },10000);
}

</script>

var B="#3a4046",BL="#5c636a",INK="#2b3035",STEEL="#24282c",RED="#c0392b",GRN="#1a7a4a",GLD="#e6a817",PUR="#7b3fa0";
var MOS=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
var TIPOS=[
  {k:"falta", lb:"Falta",  ic:"ti-calendar-x", co:RED, df:15},
  {k:"atraso",lb:"Atraso", ic:"ti-clock-x",    co:GLD, df:5}
];

// DB definido pelo Supabase acima

function gmk(dt){var d=new Date(dt+"T12:00:00");return d.getFullYear()+"-"+(""+(d.getMonth()+1)).padStart(2,"0");}
function hoje(){return new Date().toISOString().slice(0,10);}
function curMes(){return gmk(hoje());}
function uid(){return Date.now()+""+Math.random().toString(36).slice(2,6);}
function esc(s){return(s==null?"":""+s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}
function fmtBRL(v){
  v=(typeof v==="number"&&!isNaN(v))?v:(parseFloat(v)||0);
  return "R$ "+v.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
}
function fmtBRLInt(v){
  v=(typeof v==="number"&&!isNaN(v))?v:(parseFloat(v)||0);
  return "R$"+Math.round(v).toLocaleString("pt-BR");
}
function fmtM(m){var p=m.split("-");return MOS[parseInt(p[1])-1]+"/"+p[0];}
function ini(n){return n.split(" ").map(function(w){return w[0];}).slice(0,2).join("").toUpperCase();}
function tEmp(a,d){
  if(!a)return "admissao nao informada";
  var i=new Date(a+"T12:00:00"),f=d?new Date(d+"T12:00:00"):new Date();
  var anos=(f-i)/(1000*60*60*24*365.25);
  if(anos<1){var m=Math.floor(anos*12);return m<=0?"< 1 mes":m+" mes"+(m>1?"es":"");}
  return anos.toFixed(1)+" anos";
}
function getPct(tipo,data){
  var at=DB.idx.filter(function(x){return x.tipo===tipo&&x.ini<=data&&(!x.fim||x.fim>=data);});
  if(at.length>0)return at[at.length-1].pct;
  return {falta:15,atraso:5,"5s":10}[tipo]||0;
}
function calcDesc(eid,mes,val){
  var ocs=DB.oc.filter(function(x){return x.eid===eid&&gmk(x.data)===mes;});
  var f=ocs.filter(function(x){return x.tipo==="falta";}).length;
  var a=ocs.filter(function(x){return x.tipo==="atraso";}).length;
  var s=ocs.filter(function(x){return x.tipo==="5s";}).length;
  var pct=0;ocs.forEach(function(x){pct+=getPct(x.tipo,x.data);});
  pct=Math.min(100,pct);
  return{f:f,a:a,s:s,pct:pct,desc:(pct/100)*val,rec:val*(1-pct/100)};
}
function getMeses(){
  var s={};s[curMes()]=1;DB.oc.forEach(function(o){s[gmk(o.data)]=1;});
  return Object.keys(s).sort().reverse();
}

// ═══ STATUS DO COLABORADOR ═══
// Ativo: campo "ativo" (novo). Cadastros antigos sem o campo: ativo se nao tiver data de demissao.
function isAtivo(e){return e.ativo===undefined?!e.dem:e.ativo!==false;}
// Conta para o mes (premios/relatorios): ativo, ou saiu (demissao/inativacao) depois daquele mes.
function empNoMes(e,mes){
  if(isAtivo(e))return true;
  var c=e.dem||e.inat;
  return !!c&&gmk(c)>mes;
}
function fmtD(d){if(!d)return "";var p=d.split("-");return p.length===3?p[2]+"/"+p[1]+"/"+p[0]:d;}
function gv(id){var el=document.getElementById(id);return el?el.value:"";}

// ═══ AFASTAMENTO E DATAS COMEMORATIVAS ═══
function mmdd(d){return d&&d.length>=10?d.slice(5,10):"";} // "MM-DD"
function anosInt(dataRef,dataBase){ // anos inteiros completos de dataBase ate dataRef
  if(!dataBase)return 0;
  var b=new Date(dataBase+"T12:00:00"),r=new Date(dataRef+"T12:00:00");
  var a=r.getFullYear()-b.getFullYear();
  if(r.getMonth()<b.getMonth()||(r.getMonth()===b.getMonth()&&r.getDate()<b.getDate()))a--;
  return a;
}
// Colaborador afastado em uma data especifica (dentro de algum periodo de afastamento)
function afastadoEm(e,data){
  if(!e.afast||!e.afast.length)return null;
  for(var i=0;i<e.afast.length;i++){
    var af=e.afast[i];
    if(af.ini&&af.ini<=data&&(!af.fim||af.fim>=data))return af;
  }
  return null;
}
// Colaborador afastado durante o mes m ("YYYY-MM") - qualquer sobreposicao com o mes
function afastadoNoMes(e,m){
  if(!e.afast||!e.afast.length)return false;
  var ini=m+"-01",fim=fimMesStr(m);
  return e.afast.some(function(af){return af.ini&&af.ini<=fim&&(!af.fim||af.fim>=ini);});
}
// Colaborador visivel no sistema: nao esta afastado hoje (afastado some de todas as telas e relatorios, exceto Colaboradores)
function vis(e){return !!e&&!afastadoEm(e,hoje());}
function ativoVis(e){return isAtivo(e)&&vis(e);}
// Filtro de lancamentos: oculta ocorrencias de colaboradores afastados
function ocVisF(){var h={};DB.emp.forEach(function(e){if(!vis(e))h[e.id]=1;});return function(o){return !h[o.eid];};}
// Conta para premios/relatorios: dentro do vinculo E nao afastado no mes E nao afastado hoje
function contaNoMes(e,m){return empNoMes(e,m)&&!afastadoNoMes(e,m)&&vis(e);}

// ═══ CORES DEGRADE PARA GRAFICOS ═══
function shade(hex,p){
  var h=hex.replace("#","");if(h.length===3)h=h.split("").map(function(c){return c+c;}).join("");
  var n=parseInt(h,16),r=n>>16,g=(n>>8)&255,b=n&255;
  function f(c){return Math.round(p<0?c*(1+p):c+(255-c)*p);}
  return "rgb("+f(r)+","+f(g)+","+f(b)+")";
}
// Degrade vertical (barras): mais claro na base, cor cheia no topo
function vGrad(c){
  return function(ctx){
    var ch=ctx.chart,a=ch.chartArea;if(!a)return c;
    var g=ch.ctx.createLinearGradient(0,a.bottom,0,a.top);
    g.addColorStop(0,shade(c,.55));g.addColorStop(.6,shade(c,.05));g.addColorStop(1,shade(c,-.18));
    return g;
  };
}
// Degrade por fatia (rosca/pizza)
function segGrad(colors){
  return function(ctx){
    var c=colors[ctx.dataIndex%colors.length]||"#888";
    var ch=ctx.chart,a=ch.chartArea;if(!a)return c;
    var g=ch.ctx.createLinearGradient(a.left,a.top,a.right,a.bottom);
    g.addColorStop(0,shade(c,.32));g.addColorStop(1,shade(c,-.22));
    return g;
  };
}

// DASHBOARD
function rDash(){
  killCH();
  var selAno=document.getElementById("dash-ano")&&document.getElementById("dash-ano").value||String(new Date().getFullYear());
  var selMes=document.getElementById("dash-mes")&&document.getElementById("dash-mes").value||curMes();
  var modo=document.getElementById("dash-modo")&&document.getElementById("dash-modo").value||"mes"; // "mes" ou "ano"

  // Build year options
  var anos={};DB.oc.forEach(function(o){anos[gmk(o.data).split("-")[0]]=1;});DB.pr.forEach(function(p){});
  var anoAtual=String(new Date().getFullYear());anos[anoAtual]=1;
  var anoOpts=Object.keys(anos).sort().reverse().map(function(a){return "<option value='"+a+"'"+(a===selAno?" selected":"")+">"+a+"</option>";}).join("");

  // Testa se uma data cai dentro do periodo selecionado (mes especifico ou o ano inteiro)
  function noPeriodo(dataStr){
    return modo==="ano"?gmk(dataStr).split("-")[0]===selAno:gmk(dataStr)===selMes;
  }

  // Build annual data - usa apenas os meses que realmente possuem lancamentos (ocorrencias) no ano,
  // em vez de forcar Jan-Dez inteiro (que gerava valores de premio "fantasma" em meses sem nenhum uso do sistema)
  var mesesComDado={};
  DB.oc.forEach(function(o){var m=gmk(o.data);if(m.split("-")[0]===selAno)mesesComDado[m]=1;});
  if(selAno===String(new Date().getFullYear()))mesesComDado[curMes()]=1; // sempre inclui o mes atual, mesmo sem lancamentos
  var meses12=Object.keys(mesesComDado).sort();
  var lblAnual=meses12.map(function(m){return MOS[parseInt(m.split("-")[1],10)-1];});
  var aPago=[],aPerd=[],aFaltas=[],aAtrasos=[];
  meses12.forEach(function(mes){
    var p2=0,l2=0,f2=0,a2=0;
    DB.emp.forEach(function(e){
      if(!contaNoMes(e,mes))return;
      var pr=DB.pr.find(function(x){return x.eid===e.id;});if(!pr)return;
      var d=calcDesc(e.id,mes,pr.val);p2+=d.rec;l2+=d.desc;f2+=d.f;a2+=d.a;
    });
    aPago.push(+p2.toFixed(2));aPerd.push(+l2.toFixed(2));aFaltas.push(f2);aAtrasos.push(a2);
  });

  // Stats para o periodo selecionado (mes ou ano acumulado)
  var tp=0,tl=0,tf=0,ta=0,ok=0;
  if(modo==="ano"){
    tp=aPago.reduce(function(a,b){return a+b;},0);
    tl=aPerd.reduce(function(a,b){return a+b;},0);
    tf=aFaltas.reduce(function(a,b){return a+b;},0);
    ta=aAtrasos.reduce(function(a,b){return a+b;},0);
    DB.emp.forEach(function(e){
      var p=DB.pr.find(function(x){return x.eid===e.id;});if(!p)return;
      var mesesEmp=meses12.filter(function(mes){return contaNoMes(e,mes);});
      if(mesesEmp.length===0)return;
      var perfeito=mesesEmp.every(function(mes){return calcDesc(e.id,mes,p.val).pct===0;});
      if(perfeito)ok++;
    });
  }else{
    DB.emp.forEach(function(e){
      if(!contaNoMes(e,selMes))return;
      var p=DB.pr.find(function(x){return x.eid===e.id;});if(!p)return;
      var d=calcDesc(e.id,selMes,p.val);
      tp+=d.rec;tl+=d.desc;tf+=d.f;ta+=d.a;if(d.pct===0)ok++;
    });
  }
  // Infracoes 5S = numero de lancamentos (eventos) no periodo, nao a quantidade de colaboradores afetados
  var ts=DB.oc5.filter(function(o){return noPeriodo(o.data);}).length;
  var ml=modo==="ano"?("Ano "+selAno+" (Acumulado)"):fmtM(selMes);
  var sufixo=modo==="ano"?"no Ano":"no Mes";

  // Ranking de Faltas e Atrasos no periodo (todos os colaboradores com ocorrencia, independente de ter premio cadastrado)
  var famap={},aamap={},ocV=ocVisF();
  DB.oc.forEach(function(o){
    if(!noPeriodo(o.data)||!ocV(o))return;
    if(o.tipo==="falta")famap[o.eid]=(famap[o.eid]||0)+1;
    else if(o.tipo==="atraso")aamap[o.eid]=(aamap[o.eid]||0)+1;
  });
  function mkRank(map){
    return Object.keys(map).map(function(eid){
      var e=DB.emp.find(function(x){return x.id===eid;});
      return{nome:e?e.nome:"Colaborador removido",count:map[eid]};
    }).sort(function(a,b){return b.count-a.count;});
  }
  var rankF=mkRank(famap),rankA=mkRank(aamap);
  function rankHTML(items,color,emptyMsg){
    if(items.length===0)return "<div style='color:#aaa;text-align:center;padding:1.5rem;font-size:12px'>"+emptyMsg+"</div>";
    var top=items.slice(0,10);
    var medals=["#e6a817","#9aa5b8","#b9714a"];

// ═══════════════════════════════════════
// RELATORIO PDF DO DASHBOARD (2 folhas A4)
// ═══════════════════════════════════════
function gerarRelatorioPDF(){
  if(!(window.jspdf&&window.jspdf.jsPDF)){alert("A biblioteca de PDF ainda esta carregando. Aguarde alguns segundos e tente novamente.");return;}
  if(typeof Chart==="undefined"){alert("A biblioteca de graficos ainda esta carregando. Aguarde alguns segundos e tente novamente.");return;}
  var st=window._dashStats;
  if(!st){alert("Abra o Dashboard antes de gerar o relatorio.");return;}
  var jsPDF=window.jspdf.jsPDF;
  var doc=new jsPDF({unit:"mm",format:"a4",orientation:"landscape",compress:true});
  var pageW=297,pageH=210,mg=13,cw=pageW-mg*2;
  var rgbB=[58,64,70],rgbBL=[107,115,123],rgbINK=[36,40,44],rgbRED=[192,57,43],rgbGRN=[26,122,74],rgbGLD=[230,168,23],rgbPUR=[123,63,160],rgbLine=[226,231,238];
  var BANDH=25,PXSCALE=7;

  function rgba(rgb,a){return "rgba("+rgb[0]+","+rgb[1]+","+rgb[2]+","+(a===undefined?1:a)+")";}

  // ---- Elementos base reutilizaveis ----
  function panel(x,y,w,h){
    doc.setFillColor(255,255,255);
    doc.setDrawColor(rgbLine[0],rgbLine[1],rgbLine[2]);doc.setLineWidth(.35);
    doc.roundedRect(x,y,w,h,2,2,"FD");
  }
  function header(titulo){
    doc.setFillColor(rgbINK[0],rgbINK[1],rgbINK[2]);
    doc.rect(0,0,pageW,BANDH,"F");
    doc.setFillColor(rgbBL[0],rgbBL[1],rgbBL[2]);
    doc.rect(0,BANDH,pageW,1.2,"F");
    if(window._logoPNG){
      doc.addImage(window._logoPNG,"PNG",mg,4.2,28.6,13);
      doc.setFont("helvetica","normal");doc.setFontSize(7.5);
      doc.setTextColor(200,208,218);
      doc.text("TORR Equipamentos  -  Gestão de Prêmios",mg+28.6+4,15.2);
    }else{
      doc.setFont("helvetica","bold");doc.setFontSize(15);
      doc.setTextColor(255,255,255);
      doc.text("TORR",mg,11);
      doc.setFont("helvetica","normal");doc.setFontSize(7.5);
      doc.setTextColor(200,208,218);
      doc.text("Equipamentos  -  Gestão de Prêmios",mg,16.5);
    }
    doc.setFont("helvetica","bold");doc.setFontSize(12);
    doc.setTextColor(255,255,255);
    doc.text(titulo,pageW-mg,10.5,{align:"right"});
    var agora=new Date();
    var dataStr=agora.toLocaleDateString("pt-BR")+" as "+agora.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
    doc.setFont("helvetica","normal");doc.setFontSize(8);
    doc.setTextColor(215,224,242);
    doc.text("Periodo: "+st.ml,pageW-mg,16,{align:"right"});
    doc.setFontSize(7);doc.setTextColor(180,195,225);
    doc.text("Gerado em "+dataStr,pageW-mg,20.5,{align:"right"});
    return BANDH+9;
  }
  function footer(pagNum){
    doc.setDrawColor(rgbLine[0],rgbLine[1],rgbLine[2]);doc.setLineWidth(.3);
    doc.line(mg,pageH-10,pageW-mg,pageH-10);
    doc.setFont("helvetica","normal");doc.setFontSize(7.3);doc.setTextColor(165,165,165);
    doc.text("TORR Equipamentos - Sistema de Gestão de Prêmios",mg,pageH-6);
    doc.text("Documento gerado automaticamente pelo sistema",pageW/2,pageH-6,{align:"center"});
    doc.text("Pagina "+pagNum+"/2",pageW-mg,pageH-6,{align:"right"});
  }
  function sectionLabel(txt,x,y,rgb){
    doc.setFillColor(rgb[0],rgb[1],rgb[2]);
    doc.rect(x,y-3.2,2.2,2.2,"F");
    doc.setFont("helvetica","bold");doc.setFontSize(10.5);
    doc.setTextColor(50,50,50);
    doc.text(txt,x+4.5,y);
  }
  function statCard(x,y,w,h,lb,val,rgb){
    panel(x,y,w,h);
    doc.setFillColor(rgb[0],rgb[1],rgb[2]);
    doc.rect(x,y,w,1.1,"F");
    doc.setFont("helvetica","normal");doc.setFontSize(6.8);
    doc.setTextColor(130,130,130);
    doc.text(String(lb).toUpperCase(),x+3,y+7.5);
    doc.setFont("helvetica","bold");doc.setFontSize(12.5);
    doc.setTextColor(rgb[0],rgb[1],rgb[2]);
    doc.text(String(val),x+3,y+15.5);
  }
  // Painel que recebe uma imagem de grafico JA renderizada no tamanho exato da area util (sem sobra/distorcao)
  function chartPanel(imgDataUrl,x,y,w,h,titulo,rgb){
    panel(x,y,w,h);
    doc.setFont("helvetica","bold");doc.setFontSize(8.5);
    doc.setTextColor(rgb[0],rgb[1],rgb[2]);
    doc.text(titulo,x+4,y+6.5);
    doc.setDrawColor(rgbLine[0],rgbLine[1],rgbLine[2]);doc.setLineWidth(.25);
    doc.line(x+4,y+8.5,x+w-4,y+8.5);
    var areaX=x+4,areaY=y+11,areaW=w-8,areaH=h-14;
    if(!imgDataUrl){
      doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(190,190,190);
      doc.text("Sem dados no periodo",x+w/2,y+h/2,{align:"center"});
      return;
    }
    doc.addImage(imgDataUrl,"PNG",areaX,areaY,areaW,areaH);
  }
  function rankPanel(x,y,w,h,title,items,rgb,colLabel){
    panel(x,y,w,h);
    doc.setFont("helvetica","bold");doc.setFontSize(8.5);
    doc.setTextColor(rgb[0],rgb[1],rgb[2]);
    doc.text(title,x+4,y+6.5);
    var tx=x+4,tw=w-8,rowH=5.6,yy=y+9.5;
    doc.setFillColor(rgb[0],rgb[1],rgb[2]);
    doc.rect(tx,yy,tw,rowH,"F");
    doc.setFont("helvetica","bold");doc.setFontSize(7.3);doc.setTextColor(255,255,255);
    doc.text("#",tx+2.5,yy+3.8);
    doc.text("Colaborador",tx+9,yy+3.8);
    doc.text(colLabel,tx+tw-2.5,yy+3.8,{align:"right"});
    yy+=rowH;
    var maxRows=Math.max(1,Math.floor((h-(yy-y)-3)/rowH));
    var top=items.slice(0,Math.min(10,maxRows));
    if(top.length===0){
      doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(190,190,190);
      doc.text("Sem ocorrencias no periodo",tx+2.5,yy+4);
      return;
    }
    top.forEach(function(it,i){
      if(i%2===1){doc.setFillColor(248,250,255);doc.rect(tx,yy,tw,rowH,"F");}
      doc.setFont("helvetica","normal");doc.setFontSize(7.3);doc.setTextColor(70,70,70);
      doc.text(String(i+1),tx+2.5,yy+3.8);
      var nomeShort=it.nome.length>36?it.nome.slice(0,34)+"...":it.nome;
      doc.text(nomeShort,tx+9,yy+3.8);
      doc.setFont("helvetica","bold");doc.setTextColor(rgb[0],rgb[1],rgb[2]);
      doc.text(String(it.count),tx+tw-2.5,yy+3.8,{align:"right"});
      yy+=rowH;
    });
  }

  // ---- Geracao de graficos em canvas temporario (fora da tela), no tamanho EXATO da area do painel ----
  // Isso garante que a imagem preencha o quadrado inteiro, sem sobra branca nem distorcao.
  function tempCanvas(pxW,pxH){
    var cv=document.createElement("canvas");
    cv.width=pxW;cv.height=pxH;
    cv.style.position="fixed";cv.style.left="-99999px";cv.style.top="0";
    document.body.appendChild(cv);
    return cv;
  }
  var dlP=(typeof ChartDataLabels!=="undefined")?[ChartDataLabels]:[];
  function renderOffscreen(cfg,areaW,areaH){
    var pxW=Math.max(50,Math.round(areaW*PXSCALE)),pxH=Math.max(50,Math.round(areaH*PXSCALE));
    var cv=tempCanvas(pxW,pxH);
    var ch=new Chart(cv,cfg);
    var img=ch.toBase64Image();
    ch.destroy();cv.remove();
    return img;
  }
  function doughnutImg(bd,areaW,areaH){
    if(!bd||!bd.labels||bd.labels.length===0)return null;
    return renderOffscreen({type:"doughnut",plugins:dlP,
      data:{labels:bd.labels,datasets:[{data:bd.values,backgroundColor:bd.colors,borderWidth:2,borderColor:"#fff"}]},
      options:{responsive:false,animation:false,
        plugins:{legend:{position:"bottom",labels:{boxWidth:16,font:{size:15},padding:10}},
          datalabels:{color:"#fff",font:{size:15,weight:700},formatter:function(v){return v;}}}}
    },areaW,areaH);
  }
  function barImg(labels,datasets,areaW,areaH,money){
    if(!labels||labels.length===0)return null;
    return renderOffscreen({type:"bar",plugins:dlP,
      data:{labels:labels,datasets:datasets},
      options:{responsive:false,animation:false,
        plugins:{legend:{display:datasets.length>1,position:"top",labels:{boxWidth:14,font:{size:14},padding:8}},
          datalabels:{display:function(ctx){return ctx.dataset.data[ctx.dataIndex]>0;},anchor:"end",align:"top",
            color:function(ctx){return ctx.dataset.borderColor;},font:{size:12,weight:700},
            formatter:function(v){return money?fmtBRLInt(v):v;}}},
        scales:{y:{beginAtZero:true,ticks:{font:{size:13},precision:money?2:0,callback:money?function(v){return fmtBRLInt(v);}:undefined},grid:{color:"#f2f4f8"}},
                x:{ticks:{font:{size:13}},grid:{display:false}}}}
    },areaW,areaH);
  }

  // ===== PAGINA 1 - VISAO GERAL =====
  var tituloModo=st.modo==="ano"?"Relatorio Anual (Acumulado)":"Relatorio Mensal";
  var y=header(tituloModo);

  sectionLabel("Indicadores - "+st.ml,mg,y,rgbB);
  y+=4;
  var statsArr=[
    {lb:"Colaboradores ativos",val:String(DB.emp.filter(ativoVis).length),rgb:rgbB},
    {lb:"100% Premio "+st.sufixo,val:String(st.ok),rgb:rgbGRN},
    {lb:"Total Pago "+st.sufixo,val:fmtBRL(st.tp),rgb:rgbBL},
    {lb:"Total Perdido "+st.sufixo,val:fmtBRL(st.tl),rgb:rgbRED},
    {lb:"Faltas",val:String(st.tf),rgb:rgbRED},
    {lb:"Atrasos",val:String(st.ta),rgb:rgbGLD},
    {lb:"Infracoes 5S",val:String(st.ts),rgb:rgbPUR}
  ];
  var gap=3.5,cardW=(cw-6*gap)/7,cardH=20;
  statsArr.forEach(function(s,i){
    statCard(mg+i*(cardW+gap),y,cardW,cardH,s.lb,s.val,s.rgb);
  });
  y+=cardH+9;

  sectionLabel("Evolucao Anual - "+st.selAno,mg,y,rgbB);
  y+=4;
  var colW=(cw-2*gap)/3,chartH=Math.min(105,pageH-10-y-4);
  var areaW1=colW-8,areaH1=chartH-14;
  var imgPago=barImg(st.lblAnual,[{label:"Total Pago",data:st.aPago,backgroundColor:rgba(rgbGRN,.82),borderColor:rgba(rgbGRN,1),borderRadius:4}],areaW1,areaH1,true);
  var imgPerd=barImg(st.lblAnual,[{label:"Total Perdido",data:st.aPerd,backgroundColor:rgba(rgbRED,.82),borderColor:rgba(rgbRED,1),borderRadius:4}],areaW1,areaH1,true);
  var imgFA=barImg(st.lblAnual,[
    {label:"Faltas",data:st.aFaltas,backgroundColor:rgba(rgbRED,.82),borderColor:rgba(rgbRED,1),borderRadius:4},
    {label:"Atrasos",data:st.aAtrasos,backgroundColor:rgba(rgbGLD,.82),borderColor:rgba(rgbGLD,1),borderRadius:4}
  ],areaW1,areaH1,false);
  chartPanel(imgPago,mg,y,colW,chartH,"Total Pago por Mes",rgbGRN);
  chartPanel(imgPerd,mg+colW+gap,y,colW,chartH,"Total Perdido por Mes",rgbRED);
  chartPanel(imgFA,mg+2*(colW+gap),y,colW,chartH,"Faltas e Atrasos por Mes",rgbB);

  footer(1);

  // ===== PAGINA 2 - MOTIVOS E RANKINGS =====
  doc.addPage();
  y=header(tituloModo);

  sectionLabel("Motivos das Ocorrencias - "+st.ml,mg,y,rgbB);
  y+=4;
  var motH=72;
  var areaW2=colW-8,areaH2=motH-14;
  var imgFmot=doughnutImg(st.motFaltas,areaW2,areaH2);
  var imgAmot=doughnutImg(st.motAtrasos,areaW2,areaH2);
  var imgSmot=doughnutImg(st.sensos5S,areaW2,areaH2);
  chartPanel(imgFmot,mg,y,colW,motH,"Motivos de Faltas",rgbRED);
  chartPanel(imgAmot,mg+colW+gap,y,colW,motH,"Motivos de Atrasos",rgbGLD);
  chartPanel(imgSmot,mg+2*(colW+gap),y,colW,motH,"5S por Senso",rgbPUR);
  y+=motH+9;

  sectionLabel("Rankings - "+st.ml,mg,y,rgbB);
  y+=4;
  var rankW=(cw-gap)/2,rankH=Math.min(72,pageH-10-y-4);
  rankPanel(mg,y,rankW,rankH,"Ranking de Faltas",st.rankF,rgbRED,"Faltas");
  rankPanel(mg+rankW+gap,y,rankW,rankH,"Ranking de Atrasos",st.rankA,rgbGLD,"Atrasos");

  footer(2);

  doc.save("relatorio-dashboard-"+(st.modo==="ano"?st.selAno:st.selMes)+".pdf");
}

function filtCC(){
  var el=document.getElementById("cclist");if(!el)return;
  var q=gv("ccbsc").toLowerCase();
  el.innerHTML=rCCList(DB.cc.filter(function(cc){
    return !q||cc.cod.toLowerCase().includes(q)||cc.desc.toLowerCase().includes(q)||(cc.resp||"").toLowerCase().includes(q);
  }).sort(function(a,b){return a.cod.localeCompare(b.cod);}));
}
function novoCC(){canCC();openMd("md-cc");}
function savCC(){
  var id=gv("cceid");
  var cod=gv("cccod").trim(),desc=gv("ccdesc").trim(),resp=gv("ccresp").trim(),obs=gv("ccobs").trim();
  if(!cod||!desc){alert("Preencha codigo e descricao.");return;}
  if(DB.cc.find(function(x){return x.cod.toLowerCase()===cod.toLowerCase()&&x.id!==id;})){alert("Codigo ja existe.");return;}
  var obj={id:id||uid(),cod:cod,desc:desc,resp:resp,obs:obs};
  if(id){DB.cc=DB.cc.map(function(x){return x.id===id?obj:x;});}else{DB.cc.push(obj);}
  dbSave();rCC();
}
function edtCC(id){
  var cc=DB.cc.find(function(x){return x.id===id;});if(!cc)return;
  document.getElementById("cceid").value=id;
  document.getElementById("cccod").value=cc.cod;
  document.getElementById("ccdesc").value=cc.desc;
  document.getElementById("ccresp").value=cc.resp||"";
  document.getElementById("ccobs").value=cc.obs||"";
  document.getElementById("ccft").textContent="Editar centro de custo";
  document.getElementById("ccsav").textContent="Salvar alteracoes";
  openMd("md-cc");
}
function canCC(){
  ["cceid","cccod","ccdesc","ccresp","ccobs"].forEach(function(id){var el=document.getElementById(id);if(el)el.value="";});
  var t=document.getElementById("ccft");if(t)t.textContent="Novo centro de custo";
  var b=document.getElementById("ccsav");if(b)b.textContent="Cadastrar";
  closeMd("md-cc");
}
function delCC(id){
  var cnt=DB.emp.filter(function(e){return e.ccid===id;}).length;
  var msg=cnt>0?"Centro possui "+cnt+" colaborador"+(cnt!==1?"es":"")+". Remover mesmo assim?":"Remover este centro?";
  if(!confirm(msg))return;
  DB.cc=DB.cc.filter(function(x){return x.id!==id;});
  DB.emp=DB.emp.map(function(e){return e.ccid===id?Object.assign({},e,{ccid:""}):e;});
  dbSave();rCC();
}

function empListaFiltrada(q){
  q=(q||"").toLowerCase();
  return DB.emp.filter(function(e){
    var a=isAtivo(e);

    if(empFiltro==="afastados"&&!(a&&!vis(e)))return false;
    if(empFiltro==="inativos"&&a)return false;
    return !q||e.nome.toLowerCase().includes(q)||(e.func||"").toLowerCase().includes(q)||(e.empresa||"").toLowerCase().includes(q)||(e.horario||"").toLowerCase().includes(q)||empVinc(e).toLowerCase()===q;
  }).sort(function(a,b){return a.nome.localeCompare(b.nome);});
}

];
function empColKey(){return "torr_emp_cols_ocultas"+(empCtx==="res"?"_res":"");}
function empColOcultas(){try{return JSON.parse(localStorage.getItem(empColKey())||"[]");}catch(e){return [];}}
function setEmpColOcultas(a){try{localStorage.setItem(empColKey(),JSON.stringify(a));}catch(e){}}
function empColsVis(){var o=empColOcultas();return EMP_COLS.filter(function(c){return c.fixa||o.indexOf(c.k)<0;});}
function empTemValores(e){return typeof e.sal==="number"||!!assidInfo(e)||BENEF.some(function(b){return typeof e[b.k]==="number";});}
function empCampoVal(e,k){
  if(k==="terco"||k==="dec13")return typeof e.sal==="number"?calcSal(e.sal)[k]:null;
  if(k==="custo")return empTemValores(e)?calcCusto(e):null;
  if(k==="assid"){var ai=assidInfo(e);return ai?ai.rec:null;}
  return typeof e[k]==="number"?e[k]:null;
}
function empSitTxt(e){var a=isAtivo(e);return a?(afastadoEm(e,hoje())?"AFASTADO":"ATIVO"):(e.dem?"DEMITIDO":"INATIVO");}
// Texto exibido/filtrado de cada coluna
function empTxt(e,k){
  if(k==="cc"){var c=e.ccid?DB.cc.find(function(x){return x.id===e.ccid;}):null;return c?c.cod+" - "+c.desc:"";}
  if(k==="vinc")return empVinc(e);
  if(k==="grupo"){var g=e.grupo?(DB.grupos||[]).find(function(x){return x.id===e.grupo;}):null;return g?g.nome:"";}
  if(k==="sit")return empSitTxt(e);
  if(k==="tempo")return e.adm?tEmp(e.adm,e.dem):"";
  if(k==="adm"||k==="aniv")return e[k]?fmtD(e[k]):"";
  if(MONEY_K.indexOf(k)>=0){var v=empCampoVal(e,k);return v===null?"":fmtBRL(v);}
  return (k==="nome"?e.nome:e[k])||"";
}
function empSortVal(e,k){
  if(MONEY_K.indexOf(k)>=0){var v=empCampoVal(e,k);return v===null?-1:v;}
  if(k==="adm"||k==="aniv")return e[k]||"";
  if(k==="tempo")return e.adm?-(new Date(e.adm+"T12:00:00").getTime()):1e15;
  return empTxt(e,k).toUpperCase();
}
// Lista com busca + aba + filtros de coluna
function empListaVisivel(){
  var l=empListaFiltrada(gv(empId("ebsc")));
  Object.keys(empColFil).forEach(function(k){var s=empColFil[k];l=l.filter(function(e){return s.indexOf(empTxt(e,k))>=0;});});
  var k=empSort.k,d=empSort.d;
  return l.sort(function(a,b){
    var x=empSortVal(a,k),y=empSortVal(b,k);
    var r=typeof x==="number"?x-y:x.localeCompare(y);
    if(r)return r*d;
    return (a.empresa||"").localeCompare(b.empresa||"")||(a.func||"").localeCompare(b.func||"")||a.nome.localeCompare(b.nome);
  });
}
function rEmpList(){

      return "<td class='in'><input type='number' min='0' step='0.01' class='etab-sal' value='"+v+"' placeholder='0,00' data-col='"+c.k+"' onchange=\"setValInline('"+e.id+"','"+c.k+"',this.value)\" onkeydown='salKey(event,this)'/></td>";}

    if(c.t==="calc"){var w=empCampoVal(e,c.k);return "<td class='r"+(c.cu?" cu":"")+"'"+(ro?"":" id='et"+c.k+"-"+e.id+"'")+">"+(w===null?"":fmtBRL(w))+"</td>";}
    return "<td class='"+cls+"'>"+esc(empTxt(e,c.k))+"</td>";

  var rows=list.map(function(e){

      +(empRO()?"</tr>":"<td class='act'>"

  var head=cols.map(function(c){
    var on=empSort.k===c.k,fil=!!empColFil[c.k];
    var ic=fil?"ti-filter-filled":on?(empSort.d>0?"ti-sort-ascending":"ti-sort-descending"):"ti-chevron-down";

  // posicao da celula de total: soma so nas colunas de valor

  return aviso+"<div class='etab-wrap'><table class='etab' style='min-width:"+Math.max(700,cols.length*112+90)+"px'><thead><tr>"+head
    +(empRO()?"":"<th class='c' style='cursor:default'>AÇÕES</th>")+"</tr></thead><tbody>"+rows+"</tbody><tfoot>"+foot+"</tfoot></table></div>";
}
// Menu do cabecalho (estilo Excel): classificar, filtrar valores, ocultar coluna
function fecharColMenu(){var m=document.getElementById("etab-menu");if(m)m.remove();}
function abrirColMenu(ev,k){
  ev.stopPropagation();
  var ja=document.getElementById("etab-menu");if(ja&&ja.dataset.k===k){fecharColMenu();return;}
  fecharColMenu();
  var col=EMP_COLS.find(function(c){return c.k===k;});
  var num=MONEY_K.indexOf(k)>=0,dt=col.t==="dt"||k==="tempo";
  var lA=num?"Menor para maior":dt?"Mais antigo para mais novo":"Classificar de A a Z";
  var lZ=num?"Maior para menor":dt?"Mais novo para mais antigo":"Classificar de Z a A";
  // valores distintos considerando as demais colunas filtradas
  var salva=empColFil[k];delete empColFil[k];
  var base=empListaVisivel();if(salva)empColFil[k]=salva;
  var vals={};base.forEach(function(e){vals[empTxt(e,k)]=1;});
  var lv=Object.keys(vals).sort(function(a,b){
    if(num){var pa=parseFloat(a.replace(/[^0-9,]/g,"").replace(",","."))||0,pb=parseFloat(b.replace(/[^0-9,]/g,"").replace(",","."))||0;return pa-pb;}
    if(col.t==="dt"){return a.split("/").reverse().join("").localeCompare(b.split("/").reverse().join(""));}
    return a.localeCompare(b);});
  var sel=empColFil[k];
  var m=document.createElement("div");m.id="etab-menu";m.className="etab-menu";m.dataset.k=k;
  m.innerHTML="<div class='etab-mt'>"+col.lb+"</div>"
    +"<button onclick=\"ordEmp('"+k+"',1)\"><i class='ti ti-sort-ascending'></i>"+lA+"</button>"
    +"<button onclick=\"ordEmp('"+k+"',-1)\"><i class='ti ti-sort-descending'></i>"+lZ+"</button>"
    +(col.fixa?"":"<button onclick=\"ocultarCol('"+k+"')\"><i class='ti ti-eye-off'></i>Ocultar esta coluna</button>")
    +"<div class='etab-msep'></div>"
    +"<div class='etab-mt'>Filtrar valores</div>"
    +"<input type='text' placeholder='Pesquisar...' oninput='filtMenuVals(this.value)' class='etab-mbusca'/>"
    +"<label class='etab-mchk tudo'><input type='checkbox' id='etab-tudo' "+(!sel?"checked":"")+" onchange='marcarTodosMenu(this.checked)'/>(Selecionar tudo)</label>"
    +"<div class='etab-mvals'>"+lv.map(function(v){
      return "<label class='etab-mchk' data-v='"+esc(v.toLowerCase())+"'><input type='checkbox' value='"+esc(v)+"' "+(!sel||sel.indexOf(v)>=0?"checked":"")+"/>"+(v===""?"<i style='color:#999'>(Vazias)</i>":esc(v))+"</label>";
    }).join("")+"</div>"
    +"<div class='etab-mft'><button class='btng' onclick='fecharColMenu()'>Cancelar</button><button class='btnp' onclick=\"aplicarFiltroCol('"+k+"')\">OK</button></div>";
  document.body.appendChild(m);
  var r=ev.currentTarget.getBoundingClientRect(),w=260;
  m.style.left=Math.max(8,Math.min(r.left,window.innerWidth-w-8))+"px";
  m.style.top=Math.min(r.bottom+4,window.innerHeight-Math.min(m.offsetHeight,window.innerHeight-16)-8)+"px";
}
document.addEventListener("mousedown",function(ev){var m=document.getElementById("etab-menu");if(m&&!m.contains(ev.target))fecharColMenu();});

function filtMenuVals(q){q=(q||"").toLowerCase();document.querySelectorAll("#etab-menu .etab-mvals .etab-mchk").forEach(function(l){l.style.display=l.dataset.v.indexOf(q)>=0?"":"none";});}

function setDataInline(id,k,el){
  var v=el.value||"",e=DB.emp.find(function(x){return x.id===id;});if(!e)return;
  if(k==="adm"&&v&&e.dem&&v>e.dem){alert("A admissao nao pode ser posterior a demissao ("+fmtD(e.dem)+").");el.value=e.adm||"";return;}
  if(k==="adm"&&!v&&e.adm){if(!confirm("Remover a data de admissao?")){el.value=e.adm;return;}}
  DB.emp=DB.emp.map(function(x){return x.id===id?Object.assign({},x,(function(){var o={};o[k]=v;return o;})()):x;});
  dbSave();

  if(k==="adm"){var td=el.closest("tr"),ix=empColsVis().findIndex(function(c){return c.k==="tempo";});
    if(td&&ix>=0&&td.children[ix])td.children[ix].textContent=v?tEmp(v,e.dem):"";}

// Valor digitado direto na tabela: salva e recalcula 1/3 ferias, 13o e custo mensal
function setValInline(id,key,v){
  var t=(v||"").toString().trim(),s=t===""?null:parseFloat(t.replace(",","."));
  if(s!==null&&(isNaN(s)||s<0)){alert("Informe um valor valido.");return;}
  var emp=null;
  DB.emp=DB.emp.map(function(e){
    if(e.id!==id)return e;
    var n=Object.assign({},e);
    if(s===null)delete n[key];else n[key]=+s.toFixed(2);
    if(key==="sal"){if(s===null){delete n.terco;delete n.dec13;}else{var c=calcSal(s);n.terco=c.terco;n.dec13=c.dec13;}}
    if(empTemValores(n))n.custo=calcCusto(n);else delete n.custo;
    emp=n;return n;
  });
  if(!emp)return;
  ["terco","dec13","custo"].forEach(function(x){var el=document.getElementById("et"+x+"-"+id),val=empCampoVal(emp,x);if(el)el.textContent=val===null?"":fmtBRL(val);});
  var tot={};MONEY_K.forEach(function(x){tot[x]=0;});
  empListaVisivel().forEach(function(e){if(isAtivo(e))MONEY_K.forEach(function(x){tot[x]+=empCampoVal(e,x)||0;});});
  MONEY_K.forEach(function(x){var el=document.getElementById("ettot-"+x);if(el)el.textContent=fmtBRL(tot[x]);});
  dbSave();
}
function setSalInline(id,v){setValInline(id,"sal",v);}

  if(nx){nx.focus();nx.select();}else el.blur();
}

function rjEmp(id){return DB.emp.find(function(e){return e.id===id;});}
function rjNovo(ant,forma,v){
  if(forma==="pct")return +(ant*(1+v/100)).toFixed(2);
  if(forma==="add")return +(ant+v).toFixed(2);
  return +(+v).toFixed(2);
}
function rReaj(){
  if(!DB.reaj)DB.reaj=[];
  var anoAt=String(new Date().getFullYear());

  var lista=DB.reaj.filter(function(r){
    if(selAno!=="todos"&&r.data.slice(0,4)!==selAno)return false;
    if(selTipo&&r.tipo!==selTipo)return false;
    var e=rjEmp(r.eid);
    return !q||(e&&(e.nome.toLowerCase().includes(q)||(e.empresa||"").toLowerCase().includes(q)||(e.func||"").toLowerCase().includes(q)))||(r.motivo||"").toLowerCase().includes(q);
  }).sort(function(a,b){return b.data.localeCompare(a.data)||(b.criado||"").localeCompare(a.criado||"");});

  var dif=lista.reduce(function(a,r){return a+(r.novo-r.ant);},0);

    +"<th style='cursor:default'>DATA</th><th style='cursor:default'>FUNCIONÁRIO</th><th style='cursor:default'>EMPRESA</th><th class='c' style='cursor:default'>FUNÇÃO</th>"
    +"<th class='c' style='cursor:default'>TIPO</th><th style='cursor:default'>MOTIVO</th><th class='c' style='cursor:default'>SALÁRIO ANTERIOR</th>"
    +"<th class='c' style='cursor:default'>%</th><th class='c' style='cursor:default'>NOVO SALÁRIO</th><th class='c' style='cursor:default'>DIFERENÇA</th><th class='c' style='cursor:default'>AÇÕES</th></tr></thead><tbody>"
    +lista.map(function(r){
      var e=rjEmp(r.eid),t=REAJ_TIPOS[r.tipo]||REAJ_TIPOS.espontaneo,p=r.ant>0?(r.novo/r.ant-1)*100:0;

        +"<td>"+(e?esc(e.empresa||""):"")+"</td><td class='c'>"+(e?esc(e.func||""):"")+"</td>"
        +"<td class='c'><span class='bdg' style='background:"+t.bg+";color:"+t.co+"'>"+t.lb.toUpperCase()+"</span></td>"
        +"<td style='white-space:normal'>"+esc(r.motivo||"")+(r.obs?"<div style='font-size:11px;color:#999'>"+esc(r.obs)+"</div>":"")+"</td>"
        +"<td class='r'>"+fmtBRL(r.ant)+"</td><td class='r' style='font-weight:700;color:"+(p>=0?GRN:RED)+"'>"+pct1(p)+"</td>"
        +"<td class='r' style='font-weight:800;color:"+B+"'>"+fmtBRL(r.novo)+"</td><td class='r' style='color:"+(r.novo>=r.ant?GRN:RED)+"'>"+(r.novo>=r.ant?"+":"")+fmtBRL(r.novo-r.ant)+"</td>"
        +"<td class='act'><button class='ibdel' title='Excluir reajuste' onclick=\"delReaj('"+r.id+"')\"><i class='ti ti-trash'></i></button></td></tr>";
    }).join("")+"</tbody></table></div>";
  document.getElementById("p-reajustes").innerHTML=

    +"<div class='ga' style='margin-bottom:1rem'>"
    +sCard("Reajustes no periodo",lista.length,B,"ti-trending-up",selAno==="todos"?"todos os anos":selAno)
    +sCard("Por sindicato",nS,"#1f5fa8","ti-building-community","dissidio / acordo")
    +sCard("Espontaneos",nE,GRN,"ti-hand-click","merito / promocao")
    +sCard("Aumento na folha (mes)",fmtBRL(dif),BL,"ti-cash","soma das diferencas")
    +sCard("Reajuste medio",pct1(pctMed),GLD,"ti-percentage","media dos reajustes")
    +"</div>"
    +"<div class='card'>"
    +"<div style='display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:.75rem'>"
    +"<select id='rj-ano' onchange='rReaj()' style='"+selSt+"'><option value='todos'"+(selAno==="todos"?" selected":"")+">Todos os anos</option>"+Object.keys(anos).sort().reverse().map(function(a){return "<option value='"+a+"'"+(a===selAno?" selected":"")+">"+a+"</option>";}).join("")+"</select>"
    +"<select id='rj-tipo' onchange='rReaj()' style='"+selSt+"'><option value=''>Todos os tipos</option><option value='sindicato'"+(selTipo==="sindicato"?" selected":"")+">Sindicato</option><option value='espontaneo'"+(selTipo==="espontaneo"?" selected":"")+">Espontaneo</option></select>"
    +"<input type='text' id='rj-q' value='"+esc(q)+"' placeholder='Buscar colaborador, empresa ou motivo...' oninput='rReajLista()' style='width:280px;max-width:100%;margin-left:auto'/></div>"

    +"<button type='button' class='btng' onclick='rjMarcar(true)'>Marcar visiveis</button><button type='button' class='btng' onclick='rjMarcar(false)'>Desmarcar</button></div>"

function fecharReaj(){var m=document.getElementById("md-reaj");if(m)m.remove();}
function setRjTipo(t){
  rjTipo=t;
  ["sindicato","espontaneo"].forEach(function(k){var b=document.getElementById("rjt-"+k);if(b){b.classList.toggle("on",k===t);b.style.background=k===t?REAJ_TIPOS[k].co:"";}});
  var sug=t==="sindicato"?["Dissidio coletivo","Acordo coletivo","Convencao coletiva","Piso da categoria"]:["Merito","Promocao","Enquadramento","Ajuste de mercado","Mudanca de funcao"];
  var dl=document.getElementById("rj-mot-lst");if(dl)dl.innerHTML=sug.map(function(s){return "<option value='"+s+"'>";}).join("");
}
function renderReajEmps(){
  var q=(gv("rj-busca")||"").toLowerCase(),em=gv("rj-emp");
  var l=DB.emp.filter(function(e){return isAtivo(e)&&(!em||e.empresa===em)&&(!q||e.nome.toLowerCase().includes(q)||(e.func||"").toLowerCase().includes(q));})
    .sort(function(a,b){return (a.empresa||"").localeCompare(b.empresa||"")||a.nome.localeCompare(b.nome);});
  var el=document.getElementById("rj-emps");if(!el)return;
  el.innerHTML=l.length?l.map(function(e){
    var semSal=typeof e.sal!=="number";
    return "<label class='etab-mchk' data-id='"+e.id+"'><input type='checkbox' "+(rjSel.indexOf(e.id)>=0?"checked":"")+(semSal?" disabled":"")+" onchange=\"rjTog('"+e.id+"',this.checked)\"/>"
      +"<span style='flex:1'>"+esc(e.nome)+" <span style='color:#999;font-size:11px'>"+esc(e.empresa||"")+(e.func?" &middot; "+esc(e.func):"")+"</span></span>"
      +"<span style='font-weight:700;color:"+(semSal?"#c0392b":"#555")+";font-size:12px'>"+(semSal?"sem salario":fmtBRL(e.sal))+"</span></label>";
  }).join(""):"<div style='color:#aaa;padding:.6rem;font-size:12px'>Nenhum colaborador ativo encontrado.</div>";
  updReajPrev();
}
function rjTog(id,on){rjSel=rjSel.filter(function(x){return x!==id;});if(on)rjSel.push(id);updReajPrev();}
function rjMarcar(on){
  document.querySelectorAll("#rj-emps label").forEach(function(l){var i=l.querySelector("input");if(i.disabled)return;i.checked=on;rjSel=rjSel.filter(function(x){return x!==l.dataset.id;});if(on)rjSel.push(l.dataset.id);});
  updReajPrev();
}
function updReajPrev(){
  var lb=document.getElementById("rj-vlb");if(lb)lb.textContent={pct:"Percentual (%)",add:"Acrescimo (R$)",novo:"Novo salario (R$)"}[rjForma];
  var el=document.getElementById("rj-prev");if(!el)return;
  var t=gv("rj-val").trim(),v=t===""?NaN:parseFloat(t.replace(",","."));
  if(!rjSel.length){el.innerHTML="<div class='hint' style='margin-bottom:.5rem'>Marque os colaboradores que recebem o reajuste. Quem esta sem salario cadastrado nao pode ser marcado.</div>";return;}
  var tA=0,tN=0;
  var linhas=rjSel.map(rjEmp).filter(Boolean).map(function(e){
    var n=isNaN(v)?null:rjNovo(e.sal,rjForma,v);tA+=e.sal;tN+=n===null?e.sal:n;
    return "<tr><td class='nm'>"+esc(e.nome)+"</td><td class='r'>"+fmtBRL(e.sal)+"</td><td class='r' style='font-weight:800;color:"+B+"'>"+(n===null?"—":fmtBRL(n))+"</td><td class='r' style='color:"+GRN+"'>"+(n===null?"":"+"+fmtBRL(n-e.sal))+"</td></tr>";
  }).join("");
  el.innerHTML="<div style='font-weight:700;font-size:13px;color:"+B+";margin:.25rem 0 .4rem'>Previa: "+rjSel.length+" colaborador"+(rjSel.length>1?"es":"")+"</div>"
    +"<div class='etab-wrap' style='max-height:180px'><table class='etab'><thead><tr><th style='cursor:default'>FUNCIONÁRIO</th><th class='c' style='cursor:default'>ATUAL</th><th class='c' style='cursor:default'>NOVO</th><th class='c' style='cursor:default'>DIFERENÇA</th></tr></thead><tbody>"+linhas+"</tbody>"
    +"<tfoot><tr><td>TOTAL MENSAL</td><td class='r'>"+fmtBRL(tA)+"</td><td class='r'>"+fmtBRL(tN)+"</td><td class='r'>+"+fmtBRL(tN-tA)+"</td></tr></tfoot></table></div>";
}
function savReaj(){
  var mot=gv("rj-mot").trim(),data=gv("rj-data"),obs=gv("rj-obs").trim();
  var t=gv("rj-val").trim(),v=t===""?NaN:parseFloat(t.replace(",","."));
  if(!rjSel.length){alert("Marque ao menos um colaborador.");return;}
  if(!mot){alert("Informe o motivo / descricao do reajuste.");return;}
  if(!data){alert("Informe a data de vigencia.");return;}
  if(isNaN(v)||v<=0){alert("Informe um valor de reajuste valido.");return;}
  var lote=uid(),criado=new Date().toISOString(),regs=[];
  rjSel.forEach(function(id){
    var e=rjEmp(id);if(!e||typeof e.sal!=="number")return;
    regs.push({id:uid(),lote:lote,eid:id,data:data,tipo:rjTipo,motivo:mot,obs:obs,forma:rjForma,valor:v,ant:e.sal,novo:rjNovo(e.sal,rjForma,v),criado:criado});
  });
  if(regs.some(function(r){return r.novo<r.ant;})&&!confirm("Algum novo salario ficou menor que o atual. Continuar?"))return;
  if(!confirm("Aplicar reajuste ("+REAJ_TIPOS[rjTipo].lb+") para "+regs.length+" colaborador"+(regs.length>1?"es":"")+"?\nO salario no cadastro sera atualizado."))return;
  regs.forEach(function(r){aplicarSalEmp(r.eid,r.novo);});
  DB.reaj=(DB.reaj||[]).concat(regs);
  dbSave();fecharReaj();rReaj();
}
// Atualiza salario e recalcula 1/3, 13o e custo
function aplicarSalEmp(id,sal){
  DB.emp=DB.emp.map(function(e){
    if(e.id!==id)return e;
    var n=Object.assign({},e),c=calcSal(sal);n.sal=sal;n.terco=c.terco;n.dec13=c.dec13;n.custo=calcCusto(n);return n;
  });
}
function delReaj(id){
  var r=(DB.reaj||[]).find(function(x){return x.id===id;});if(!r)return;
  var e=rjEmp(r.eid);
  var volta=e&&typeof e.sal==="number"&&Math.abs(e.sal-r.novo)<0.005;
  var msg="Excluir este reajuste?"+(volta?"\n\nO salario de "+e.nome+" volta para "+fmtBRL(r.ant)+".":"\n\nO salario atual nao sera alterado (ja foi modificado depois deste reajuste).");
  if(!confirm(msg))return;
  if(volta)aplicarSalEmp(r.eid,r.ant);
  DB.reaj=DB.reaj.filter(function(x){return x.id!==id;});
  dbSave();rReaj();
}

function gruposOrd(){

    return (a.ord||0)-(b.ord||0)||a.nome.localeCompare(b.nome);
  });
}

// ═══ CUSTO TOTAL DA FOLHA DE PAGAMENTO (jan-dez por grupo) ═══
// Base: Resumo dos Custos (custo empresa mensal de cada colaborador), somado por grupo.
// Salario do mes considera os reajustes (antes do reajuste vale o salario anterior).
var MESF=["JANEIRO","FEVEREIRO","MARÇO","ABRIL","MAIO","JUNHO","JULHO","AGOSTO","SETEMBRO","OUTUBRO","NOVEMBRO","DEZEMBRO"];
function empAtivoNoMes(e,m){
  var ini=m+"-01",fim=fimMesStr(m);
  if(e.adm&&e.adm>fim)return false;
  if(e.dem)return e.dem>=ini;
  if(!isAtivo(e))return !!e.inat&&e.inat>=ini;
  return true;
}
function salNoMes(e,m){
  if(typeof e.sal!=="number")return undefined;
  var fim=fimMesStr(m);
  var rs=(DB.reaj||[]).filter(function(r){return r.eid===e.id&&r.data>fim;}).sort(function(a,b){return a.data.localeCompare(b.data)||(a.criado||"").localeCompare(b.criado||"");});
  return rs.length?rs[0].ant:e.sal;
}
function custoNoMes(e,m){
  var o=Object.assign({},e),s=salNoMes(e,m);
  if(s===undefined)delete o.sal;else o.sal=s;
  if(!(typeof o.sal==="number"||assidInfo(o,m)||BENEF.some(function(b){return typeof o[b.k]==="number";})))return 0;
  return calcCusto(o,m);
}
// valores do mes: {g:{grupoId:valor}, sem:valor, fechado:bool} ou null (mes futuro)
function folhaMes(m){
  var f=(DB.folhafech||[]).find(function(x){return x.id===m;});
  if(f)return {g:f.g||{},sem:f.sem||0,fechado:true,em:f.em};
  if(m>curMes())return null;
  var g={},sem=0,ids={};DB.grupos.forEach(function(x){ids[x.id]=1;g[x.id]=0;});
  DB.emp.forEach(function(e){
    if(!empAtivoNoMes(e,m))return;
    var v=custoNoMes(e,m);if(!v)return;
    if(e.grupo&&ids[e.grupo])g[e.grupo]+=v;else sem+=v;
  });
  Object.keys(g).forEach(function(k){g[k]=+g[k].toFixed(2);});
  return {g:g,sem:+sem.toFixed(2),fechado:false};
}
function receitaMes(m){var r=(DB.receita||[]).find(function(x){return x.id===m;});return r&&typeof r.valor==="number"?r.valor:null;}
function rFolha(){
  var anoAt=String(new Date().getFullYear()),ano=gv("fl-ano")||anoAt;
  var anos={};anos[anoAt]=1;anos[String(+anoAt-1)]=1;anos[String(+anoAt+1)]=1;
  (DB.receita||[]).forEach(function(r){anos[r.id.slice(0,4)]=1;});(DB.folhafech||[]).forEach(function(r){anos[r.id.slice(0,4)]=1;});
  var gs=gruposOrd(),gp=gs.filter(function(g){return g.tipo!=="terceiro";}),gt=gs.filter(function(g){return g.tipo==="terceiro";});
  var meses=MESF.map(function(n,i){return ano+"-"+String(i+1).padStart(2,"0");});
  var dados=meses.map(function(m){
    var f=folhaMes(m),rec=receitaMes(m);
    if(!f)return {m:m,f:null,rec:rec};
    var folha=gp.reduce(function(a,g){return a+(f.g[g.id]||0);},0),terc=gt.reduce(function(a,g){return a+(f.g[g.id]||0);},0);
    return {m:m,f:f,rec:rec,folha:folha,terc:terc,geral:folha+terc};
  });
  var comDado=dados.filter(function(d){return d.f;}),comRec=dados.filter(function(d){return d.rec!==null&&d.rec>0;});
  function soma(fn,l){return (l||comDado).reduce(function(a,d){return a+fn(d);},0);}
  function med(fn,l){l=l||comDado;return l.length?soma(fn,l)/l.length:null;}
  var tFolha=soma(function(d){return d.folha;}),tTerc=soma(function(d){return d.terc;}),tGeral=tFolha+tTerc,tRec=soma(function(d){return d.rec;},comRec);
  var semNow=folhaMes(curMes()),semV=semNow?semNow.sem:0;
  var nSem=DB.emp.filter(function(e){return isAtivo(e)&&!(e.grupo&&DB.grupos.some(function(g){return g.id===e.grupo;}));}).length;
  var v=function(x){return x===null||x===undefined?"":fmtBRL(x);};
  var pct=function(c,r){return r?pct2(c/r*100):"";};
  var th=function(lb,cls,attr){return "<th class='c "+(cls||"")+"' style='cursor:default' "+(attr||"")+">"+lb+"</th>";};
  var head="<tr>"+th("MÊS","","rowspan='2'")
    +gp.map(function(g){return th("CUSTO PESSOAL<br>"+esc(g.nome).toUpperCase(),"","rowspan='2'");}).join("")
    +(gt.length?th("TERCEIRIZADOS","fl-band","colspan='"+gt.length+"'"):"")
    +th("TOTALIZADOR","fl-band2","colspan='5'")+th("SITUAÇÃO","","rowspan='2'")+"</tr><tr>"
    +gt.map(function(g){return th(esc(g.nome).toUpperCase());}).join("")
    +th("TOTAL DA FOLHA","fl-tot")+th("TOTAL CUSTO TERCEIROS","fl-tot")+th("CUSTO TOTAL DA FOLHA","fl-tot")+th("RECEITA<br><span style='font-weight:500'>(manual)</span>","fl-tot")+th("% S/ RECEITA","fl-tot")+"</tr>";
  var body=dados.map(function(d,i){
    var f=d.f,mm=MESF[i];
    var cells=gp.concat(gt).map(function(g){return "<td class='r'>"+(f?v(f.g[g.id]||0):"")+"</td>";}).join("");
    var st=!f?"<span style='color:#b0b8c1;font-size:11px'>futuro</span>"
      :f.fechado?"<button class='fl-st fech' onclick=\"reabrirMes('"+d.m+"')\" title='Fechado em "+(f.em?fmtD(f.em.slice(0,10)):"")+". Clique para reabrir'><i class='ti ti-lock'></i>Fechado</button>"
      :"<button class='fl-st' onclick=\"fecharMes('"+d.m+"')\" title='Congelar os valores deste mes'><i class='ti ti-lock-open'></i>Fechar</button>";
    return "<tr class='"+(d.m===curMes()?"fl-cur":"")+"'><td class='nm'>"+mm+"</td>"+cells
      +"<td class='r fl-c'>"+(f?v(d.folha):"")+"</td><td class='r fl-c'>"+(f?v(d.terc):"")+"</td><td class='r fl-c fl-g'>"+(f?v(d.geral):"")+"</td>"
      +"<td class='in fl-c'><input type='number' min='0' step='0.01' class='etab-sal' data-col='rec' value='"+(d.rec===null?"":d.rec)+"' placeholder='0,00' onchange=\"setReceita('"+d.m+"',this.value)\" onkeydown='salKey(event,this)'/></td>"
      +"<td class='r fl-c fl-p'>"+(f&&d.rec?pct(d.geral,d.rec):"")+"</td><td class='c'>"+st+"</td></tr>";
  }).join("");
  var totG=gp.concat(gt).map(function(g){return "<td class='r'>"+fmtBRL(soma(function(d){return d.f.g[g.id]||0;}))+"</td>";}).join("");
  var medG=gp.concat(gt).map(function(g){var x=med(function(d){return d.f.g[g.id]||0;});return "<td class='r'>"+v(x)+"</td>";}).join("");
  var mF=med(function(d){return d.folha;}),mT=med(function(d){return d.terc;}),mR=med(function(d){return d.rec;},comRec);
  var foot="<tr><td>TOTAL</td>"+totG+"<td class='r'>"+fmtBRL(tFolha)+"</td><td class='r'>"+fmtBRL(tTerc)+"</td><td class='r'>"+fmtBRL(tGeral)+"</td><td class='r'>"+fmtBRL(tRec)+"</td><td class='r'>"+(tRec?pct(soma(function(d){return d.rec?d.geral:0;}),tRec):"")+"</td><td></td></tr>"
    +"<tr class='fl-med'><td>MÉDIA</td>"+medG+"<td class='r'>"+v(mF)+"</td><td class='r'>"+v(mT)+"</td><td class='r'>"+v(mF===null?null:mF+mT)+"</td><td class='r'>"+v(mR)+"</td><td class='r'>"+(mR&&mF!==null?pct(mF+mT,mR):"")+"</td><td></td></tr>";
  var selSt="padding:.4rem .7rem;border:1.5px solid var(--line);border-radius:8px;font-size:13px;color:"+B+";font-weight:700;background:#fff;width:auto";
  document.getElementById("p-folha").innerHTML=
    "<div class='pg-hd'><div><h1 class='h1'>Custo Total da Folha de Pagamento</h1>"
    +"<div class='sub'>Base: Resumo dos Custos (custo empresa mensal) somado por grupo &middot; receita lancada manualmente</div></div>"

function pct2(x){return (x||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})+"%";}
function setReceita(m,val){

function fecharMes(m){

}

// Descobre quem esta logado e quais telas pode usar. null = sem acesso ao sistema
function carregarAcesso(user){
  var email=(user&&user.email||"").trim().toLowerCase();
  if(!email)return Promise.resolve(null);
  return isMasterEmail(email).then(function(m){
    if(m)return {master:true,email:email,nome:"Master",perms:{}};
    return _sb.from("torr_usuarios").select("email,nome,ativo,perms").eq("email",email).maybeSingle().then(function(r){
      if(r.error||!r.data||r.data.ativo===false)return null;
      return {master:false,email:email,nome:r.data.nome||email,perms:r.data.perms||{}};
    });
  });
}
function permTela(p){
  if(!ACESSO)return "nenhum";
  if(ACESSO.master)return "editar";
  var v=ACESSO.perms[p];
  var t=TELAS.find(function(x){return x.k===p;});
  if(t&&t.soVer&&v==="editar")v="ver";
  return v==="ver"||v==="editar"?v:"nenhum";
}
function primeiraTela(){
  if(permTela("dashboard")!=="nenhum")return "dashboard";
  var t=TELAS.find(function(x){return permTela(x.k)!=="nenhum";});

function acsSalvar(){

    showSync("Acesso de "+email+" salvo",true);setTimeout(function(){document.getElementById("sync-bar").style.display="none";},2500);
  }).catch(function(e){if(b)b.disabled=false;showSync("Erro ao salvar acesso: "+e.message,false,true);});

function acsExcluir(email){

// ═══ CALCULOS AUTOMATICOS SOBRE O SALARIO ═══
function calcSal(sal){
  sal=+sal||0;
  return {terco:+(sal/3).toFixed(2),dec13:+sal.toFixed(2)};
}
// Beneficios do colaborador (valores digitados). anual=true entra no custo mensal dividido por 12
var BENEF=[
  {k:"cesta",lb:"Cesta basica"},
  {k:"pmetas",lb:"Premio metas"},
  {k:"bonus",lb:"Bonus anual",anual:true},
  {k:"refeit",lb:"Refeitorio"}
];
// Custo empresa mensal: mensais + provisao mensal (1/12) do 1/3 ferias, 13o e bonus anual
// Assiduidade = Premio Cartao Beneficio (tela Premios) do mes atual, ja com os descontos de faltas/atrasos/5S
function assidInfo(e,mes){
  if(!e||!e.id)return null;
  var pr=DB.pr.find(function(p){return p.eid===e.id;});if(!pr)return null;
  mes=mes||curMes();
  var d=calcDesc(e.id,mes,pr.val);
  return {bruto:pr.val,pct:d.pct,desc:+d.desc.toFixed(2),rec:+d.rec.toFixed(2),mes:mes};
}
function calcCusto(e,mes){
  var sal=typeof e.sal==="number"?e.sal:0,c=calcSal(sal),t=sal+(c.terco+c.dec13)/12;
  var ai=assidInfo(e,mes);if(ai)t+=ai.rec;
  BENEF.forEach(function(b){var v=+e[b.k]||0;t+=b.anual?v/12:v;});
  return +t.toFixed(2);
}
function numVal(id){var t=gv(id).trim();if(t==="")return null;var v=parseFloat(t.replace(",","."));return isNaN(v)||v<0?NaN:v;}
function updSalCalc(){
  var v=numVal("esal");
  var a=document.getElementById("eterco"),b=document.getElementById("e13"),cu=document.getElementById("ecusto");
  if(!a||!b)return;
  if(v===null||isNaN(v)){a.value="";b.value="";}
  else{var c=calcSal(v);a.value=fmtBRL(c.terco);b.value=fmtBRL(c.dec13);}
  var ai=assidInfo({id:gv("eid")}),av=document.getElementById("eassidv");
  if(av)av.value=ai?fmtBRL(ai.rec)+(ai.pct>0?"  (premio "+fmtBRL(ai.bruto)+" - "+pct1(ai.pct)+" de desconto em "+fmtM(ai.mes)+")":"  (sem descontos em "+fmtM(ai.mes)+")"):"Sem premio cadastrado em Premios";
  if(cu){
    var o={id:gv("eid"),sal:(v===null||isNaN(v))?undefined:v},alg=(v!==null&&!isNaN(v))||!!ai;
    BENEF.forEach(function(x){var n=numVal("e"+x.k);if(n!==null&&!isNaN(n)){o[x.k]=n;alg=true;}});
    cu.value=alg?fmtBRL(calcCusto(o)):"";
  }
}
function empresasCad(){
  var s={};DB.emp.forEach(function(e){if(e.empresa)s[e.empresa]=1;});
  return Object.keys(s).sort();
}
function savEmp(){
  var id=gv("eid");
  var nome=gv("enome").trim(),func=gv("efunc").trim(),ccid=gv("ecc"),adm=gv("eadm"),aniv=gv("eaniv");
  var salTx=gv("esal").trim(),sal=salTx===""?null:parseFloat(salTx.replace(",","."));
  if(sal!==null&&(isNaN(sal)||sal<0)){alert("Informe um salario valido.");return;}
  var ativo=gv("eativo")==="1",vinc=gv("evinc")==="MEI"?"MEI":"CLT";
  var empresa=gv("eempresa").trim(),horario=gv("ehorario").trim(),bv={};
  for(var bi=0;bi<BENEF.length;bi++){var nb=numVal("e"+BENEF[bi].k);if(isNaN(nb)){alert("Valor invalido em "+BENEF[bi].lb+".");return;}bv[BENEF[bi].k]=nb;}
  if(!nome||!func||!adm){alert("Preencha nome, funcao e admissao.");return;}
  var old=id?DB.emp.find(function(e){return e.id===id;}):null;
  if(old&&old.dem&&ativo&&!confirm(nome+" esta demitido. Marcar como ativo cancela a demissao. Continuar?"))return;
  var obj=Object.assign({},old||{dem:""},{id:id||uid(),nome:nome,func:func,ccid:ccid,adm:adm,aniv:aniv,ativo:ativo,vinc:vinc});
  if(sal===null){delete obj.sal;delete obj.terco;delete obj.dec13;}
  else{var cs=calcSal(sal);obj.sal=+sal.toFixed(2);obj.terco=cs.terco;obj.dec13=cs.dec13;}
  obj.empresa=empresa;obj.horario=horario;
  BENEF.forEach(function(b){if(bv[b.k]===null)delete obj[b.k];else obj[b.k]=+bv[b.k].toFixed(2);});
  delete obj.assid;
  obj.custo=calcCusto(obj);
  if(ativo){obj.dem="";delete obj.motdem;delete obj.obsdem;delete obj.inat;}
  else if(!obj.dem&&!obj.inat){obj.inat=hoje();}
  if(obj.dem&&adm>obj.dem){alert("A admissao nao pode ser posterior a demissao ("+fmtD(obj.dem)+").");return;}
  if(id){DB.emp=DB.emp.map(function(e){return e.id===id?obj:e;});}else{DB.emp.push(obj);}
  dbSave();rEmp();
}
function edtEmp(id){
  var e=DB.emp.find(function(x){return x.id===id;});if(!e)return;
  document.getElementById("eid").value=id;
  document.getElementById("enome").value=e.nome;
  document.getElementById("efunc").value=e.func;
  document.getElementById("ecc").value=e.ccid||"";
  document.getElementById("eadm").value=e.adm;
  var an=document.getElementById("eaniv");if(an)an.value=e.aniv||"";
  var sl=document.getElementById("esal");if(sl)sl.value=(e.sal!==undefined&&e.sal!==null)?e.sal:"";
  var ep=document.getElementById("eempresa");if(ep)ep.value=e.empresa||"";
  var hr=document.getElementById("ehorario");if(hr)hr.value=e.horario||"";
  BENEF.forEach(function(b){var el=document.getElementById("e"+b.k);if(el)el.value=(typeof e[b.k]==="number")?e[b.k]:"";});
  updSalCalc();
  document.getElementById("eftt").textContent="Editar colaborador";
  document.getElementById("esav").textContent="Salvar alteracoes";
  setEmpAtivo(isAtivo(e)?"1":"0");
  setEmpVinc(empVinc(e));
  var area=document.getElementById("edemarea");
  area.innerHTML=empExtraArea(e);
  openMd("md-emp");
}
function canEmp(){
  ["eid","enome","efunc","eadm","eaniv","esal","eempresa","ehorario","ecesta","eassid","epmetas","ebonus","erefeit"].forEach(function(id){var el=document.getElementById(id);if(el)el.value="";});
  updSalCalc();
  var cc=document.getElementById("ecc");if(cc)cc.value="";
  var t=document.getElementById("eftt");if(t)t.textContent="Novo colaborador";
  var btn=document.getElementById("esav");if(btn)btn.textContent="Cadastrar";
  var area=document.getElementById("edemarea");if(area)area.innerHTML="";
  setEmpAtivo("1");
  setEmpVinc("CLT");
  closeMd("md-emp");
}
function delEmp(id){
  if(!confirm("Excluir o cadastro deste colaborador?\n\nSe ele saiu da empresa, use o botao \"Demitido\" para manter o historico."))return;
  DB.emp=DB.emp.filter(function(e){return e.id!==id;});dbSave();rEmp();
}
function cancDem(id){
  var e=DB.emp.find(function(x){return x.id===id;});if(!e)return;
  if(!confirm("Cancelar a demissao de "+e.nome+"? O colaborador volta a ficar ativo."))return;
  DB.emp=DB.emp.map(function(x){
    if(x.id!==id)return x;
    var n=Object.assign({},x,{dem:"",ativo:true});delete n.motdem;delete n.obsdem;delete n.inat;return n;
  });
  dbSave();rEmp();
}

function closeDemModal(){var m=document.getElementById("md-dem");if(m)m.remove();}
function togNovoMotDem(){
  var r=document.getElementById("dmnovo");if(!r)return;
  var show=r.style.display==="none";
  r.style.display=show?"flex":"none";
  if(show)document.getElementById("dmnovonm").focus();
}
function addMotDem(){
  var nm=gv("dmnovonm").trim();
  if(!nm){alert("Informe o nome do motivo.");return;}
  var ex=DB.motdem.find(function(m){return m.nome.toLowerCase()===nm.toLowerCase();});
  var novo=ex||{id:uid(),nome:nm};
  if(!ex){DB.motdem.push(novo);dbSave();}
  var sel=document.getElementById("dmmot");if(sel)sel.innerHTML=motDemOpts(novo.id);
  document.getElementById("dmnovonm").value="";
  document.getElementById("dmnovo").style.display="none";
}
function confDem(){
  var id=gv("dmid"),data=gv("dmdata"),mot=gv("dmmot"),obs=gv("dmobs").trim();
  var e=DB.emp.find(function(x){return x.id===id;});if(!e)return;
  if(!data){alert("Informe a data da demissao.");return;}
  if(e.adm&&data<e.adm){alert("A demissao nao pode ser anterior a admissao ("+fmtD(e.adm)+").");return;}
  if(!mot){alert("Selecione o motivo da saida (ou cadastre um novo).");return;}
  DB.emp=DB.emp.map(function(x){
    if(x.id!==id)return x;
    var n=Object.assign({},x,{dem:data,motdem:mot,obsdem:obs,ativo:false});delete n.inat;return n;
  });
  dbSave();closeDemModal();
  if(pg==="employees")rEmp();else if(pg==="monitor")rMon();
}

// Monta a area de demissao + afastamentos do modal de edicao
function empExtraArea(e){
  var htmlDem="";
  if(e.dem){
    htmlDem="<div class='dem-box'><div style='font-size:12px'><b><i class='ti ti-user-minus'></i> Demitido em "+fmtD(e.dem)+"</b><br/>"
      +"Motivo: "+esc(motDemNome(e.motdem))+(e.obsdem?" &middot; "+esc(e.obsdem):"")+"</div>"
      +"<button class='btng' onclick=\"cancDem('"+e.id+"')\"><i class='ti ti-arrow-back-up'></i> Cancelar demissao</button></div>";
  }else if(isAtivo(e)){
    htmlDem="<button class='btn-dem' style='width:100%;justify-content:center;padding:.5rem' data-fn='demEmp' data-id='"+e.id+"'><i class='ti ti-user-minus'></i>Registrar demissao</button>";
  }
  return htmlDem+renderAfastArea(e);
}
function renderAfastArea(e){
  var afs=(e.afast||[]).slice().sort(function(a,b){return (b.ini||"").localeCompare(a.ini||"");});
  var hoj=hoje();
  var lista=afs.map(function(af){
    var atual=af.ini&&af.ini<=hoj&&(!af.fim||af.fim>=hoj);
    var fut=af.ini&&af.ini>hoj;
    var badge=atual?"<span class='bdg' style='background:#fdecd2;color:#8a5a00'>EM AFASTAMENTO</span>"
      :fut?"<span class='bdg' style='background:#eceef0;color:"+B+"'>AGENDADO</span>"
      :"<span class='bdg bdg-off'>ENCERRADO</span>";
    return "<div style='display:flex;justify-content:space-between;align-items:center;gap:8px;background:#fff;border:1px solid #eef1f6;border-radius:8px;padding:.45rem .6rem;margin-bottom:5px'>"
      +"<div style='font-size:12px;min-width:0'><b style='color:#333'>"+esc(motAfasNome(af.mot))+"</b> "+badge+"<br/>"
      +"<span style='color:#888'>"+fmtD(af.ini)+" &rarr; "+(af.fim?fmtD(af.fim):"sem data de retorno")+"</span>"
      +(af.obs?"<br/><span style='color:#aaa'>"+esc(af.obs)+"</span>":"")+"</div>"
      +"<button class='ibdel' title='Remover afastamento' onclick=\"delAfast('"+e.id+"','"+af.id+"')\"><i class='ti ti-trash'></i></button>"
      +"</div>";
  }).join("");
  return "<div style='margin-top:.75rem;padding-top:.75rem;border-top:1px dashed #e2e7ee'>"
    +"<div style='display:flex;justify-content:space-between;align-items:center;margin-bottom:6px'>"
    +"<span class='lbl' style='margin:0'>Afastamentos</span>"
    +"<button class='btng btn-ic' style='padding:.35rem .6rem' onclick=\"afastEmp('"+e.id+"')\"><i class='ti ti-plane-departure'></i>Registrar afastamento</button></div>"
    +(afs.length?lista:"<div class='hint' style='margin:0'>Nenhum afastamento registrado. No periodo de afastamento o colaborador nao aparece nos Premios nem no relatorio do Cartao.</div>")
    +"</div>";
}

function togNovoMotAfas(){
  var r=document.getElementById("afnovo");if(!r)return;
  var show=r.style.display==="none";
  r.style.display=show?"flex":"none";
  if(show)document.getElementById("afnovonm").focus();
}
function addMotAfas(){
  var nm=gv("afnovonm").trim();
  if(!nm){alert("Informe o nome do motivo.");return;}
  if(!DB.motafas)DB.motafas=[];
  var ex=DB.motafas.find(function(m){return m.nome.toLowerCase()===nm.toLowerCase();});
  var novo=ex||{id:uid(),nome:nm};
  if(!ex){DB.motafas.push(novo);dbSave();}
  var sel=document.getElementById("afmot");if(sel)sel.innerHTML=motAfasOpts(novo.id);
  document.getElementById("afnovonm").value="";
  document.getElementById("afnovo").style.display="none";
}
function confAfast(){
  var id=gv("afid"),mot=gv("afmot"),ini=gv("afini"),fim=gv("affim"),obs=gv("afobs").trim();
  var e=DB.emp.find(function(x){return x.id===id;});if(!e)return;
  if(!mot){alert("Selecione o motivo do afastamento (ou cadastre um novo).");return;}
  if(!ini){alert("Informe a data de inicio do afastamento.");return;}
  if(e.adm&&ini<e.adm){alert("O afastamento nao pode comecar antes da admissao ("+fmtD(e.adm)+").");return;}
  if(fim&&fim<ini){alert("A data de fim nao pode ser anterior ao inicio.");return;}
  DB.emp=DB.emp.map(function(x){
    if(x.id!==id)return x;
    var n=Object.assign({},x);n.afast=(n.afast||[]).concat([{id:uid(),mot:mot,ini:ini,fim:fim||"",obs:obs}]);return n;
  });
  dbSave();closeAfastModal();
  var e2=DB.emp.find(function(x){return x.id===id;});
  var area=document.getElementById("edemarea");if(area&&gv("eid")===id)area.innerHTML=empExtraArea(e2);
  if(pg==="employees")rEmp();
}
function delAfast(eid,afid){
  var e=DB.emp.find(function(x){return x.id===eid;});if(!e)return;
  if(!confirm("Remover este afastamento?"))return;
  DB.emp=DB.emp.map(function(x){
    if(x.id!==eid)return x;
    var n=Object.assign({},x);n.afast=(n.afast||[]).filter(function(a){return a.id!==afid;});return n;
  });
  dbSave();
  var e2=DB.emp.find(function(x){return x.id===eid;});
  var area=document.getElementById("edemarea");if(area&&gv("eid")===eid)area.innerHTML=empExtraArea(e2);
  if(pg==="employees")rEmp();
}
